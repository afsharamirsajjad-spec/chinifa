<title>Chinese Town</title>
<style>
/* 寒蝉圆黑体 ChillRoundM (SIL OFL 1.1, see fonts/OFL-ChillRound.txt), cut down to the characters this game shows */
@font-face{font-family:"XC Round";src:url(fonts/xcround.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* Nunito (SIL OFL 1.1, see fonts/OFL-Nunito.txt), the two subsets this page
   can show: latin, and latin-ext for the pinyin marks (ǎ ǐ ǒ ǔ ǖ …).

   It used to come from fonts.googleapis.com, with Noto Sans and Noto Sans SC
   beside it. That stylesheet is render-blocking and sits on another origin, so
   the game showed nothing until Google answered — 249 ms measured from here,
   seconds on a phone in Ethiopia, and never where Google is blocked. It
   declared 348 faces to deliver three: the 303 Noto Sans SC ones are never
   used (the Chinese is XC Round above, and the phone's own font after it) and
   the eight Noto Sans ones are not either. Same two files, same look, one
   origin (11-09). */
@font-face{font-family:Nunito;src:url(fonts/nunito-latin.woff2) format("woff2");font-weight:100 1000;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-ext.woff2) format("woff2");font-weight:100 1000;font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Noto Sans (SIL OFL 1.1, see fonts/OFL-NotoSans.txt), which is what --py
   writes the pinyin in. Google's own latin subset; its latin-ext is 168 KB for
   the whole of Europe, so this one is cut to the letters pinyin uses — ā ē ī ō
   ū, ǎ ǐ ǒ ǔ, ǖ ǘ ǚ ǜ, ń ň — and comes to 18 KB. Both still variable, so the
   500/600/700 the page asks for are the same shapes as before. */
@font-face{font-family:"Noto Sans";src:url(fonts/noto-sans-latin.woff2) format("woff2");font-weight:100 900;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Noto Sans";src:url(fonts/noto-sans-latin-ext.woff2) format("woff2");font-weight:100 900;font-display:swap;
  unicode-range:U+0100-017F,U+01CD-01DC,U+0300-030C,U+2000-206F}
:root{
  --ink:#3A2A1F; --ink2:#7A6553; --ink3:#A8927C; --line:#EBDCBF;
  --gold:#E9B949; --gold-d:#C8962A; --leaf:#34A853; --leaf-d:#22863E; --mint:#DAF5DE;
  --sky:#3F86D8; --sky-d:#2F68AE; --sky-l:#DCEBFB; --red:#E4483B; --red-l:#FFE1DC;
  --zh:"Nunito","XC Round","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ui:"Nunito","XC Round","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --py:"Noto Sans","Nunito",system-ui,sans-serif;
}
html,body{height:100%}
/* 10-04: a phone with a big system font size blew every word up past its spot on the map;
   the game is laid out to the pixel, so it keeps its own sizes */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#E6E1D6;color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#E8E1D4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#backdrop{position:absolute;inset:-40px;background:#8BC56A url(img/bg_taxi.webp) center/cover;filter:blur(18px) brightness(.88)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{display:block}
[hidden]{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:10px;right:10px;top:10px;z-index:20;display:flex;align-items:center;gap:7px;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;background:rgba(255,250,238,.96);border:2px solid #F0DDB4;box-shadow:0 4px 12px rgba(58,42,31,.16);font:800 13px var(--ui);white-space:nowrap;flex:0 0 auto}
.pill b{font:900 15px var(--ui);font-variant-numeric:tabular-nums}
.pill .wl{font:800 12px var(--ui);color:var(--ink2)}
.pill .of{color:var(--ink3);font-size:11px}
.pill .ic{width:20px;height:20px}
#where{font:800 14px var(--ui)}
#timer{font:900 14px var(--ui);font-variant-numeric:tabular-nums;padding:0 13px}
#timer.low{background:var(--red);border-color:var(--red);color:#fff}
.ingame #wcount,.ingame #setBtn{display:none}
.sp{flex:1}
.gear{width:38px;height:38px;border-radius:50%;background:rgba(255,250,238,.96);border:2px solid #F0DDB4;display:grid;place-items:center;box-shadow:0 4px 12px rgba(58,42,31,.16);flex:0 0 auto}
.gear svg{width:20px;height:20px}
.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.2)}}

/* ---------- world-anchored things ---------- */
#signs{position:absolute;inset:0;z-index:11;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;background:rgba(255,251,240,.95);border:1.5px solid rgba(150,100,45,.4);border-radius:9px;padding:1px 7px 2px;white-space:nowrap;box-shadow:0 2px 4px rgba(58,42,31,.12)}
.tag .t1{display:flex;align-items:baseline;gap:5px}
.tag b{font:700 14px/1.25 var(--zh)}
.tag i{font:600 10px/1.15 var(--py);font-style:normal;color:var(--ink2)}
.tag .pr{font:900 11.5px var(--ui);color:var(--red)}
.tag.place{flex-direction:row;align-items:baseline;gap:5px;border:2px solid var(--sky);padding:2px 9px 3px}
.tag.place b{font-size:16px}
#fx{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.sb{position:absolute;left:0;top:0;pointer-events:auto;max-width:280px;background:#fff;border:2px solid #E9DDC6;border-radius:18px;padding:7px 12px 8px;box-shadow:0 5px 14px rgba(58,42,31,.22);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.sb::after{content:"";position:absolute;left:var(--ax,50%);bottom:-8px;width:13px;height:13px;background:#fff;border-right:2px solid #E9DDC6;border-bottom:2px solid #E9DDC6;transform:translateX(-50%) rotate(45deg)}
.sb .zl{display:flex;align-items:center;gap:8px}
.sb .z{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 2px}
.sb .z button{display:inline-flex;flex-direction:column;align-items:center;border-radius:7px;padding:0 1px}
.sb .z i{font:600 10.5px/1.2 var(--py);font-style:normal;color:var(--ink2);min-height:12px;white-space:nowrap}
.sb .z b{font:500 22px/1.25 var(--zh);border-radius:6px;padding:0 1px;transition:background .1s,color .1s}
.sb .z .on b{background:var(--leaf);color:#fff}
.sb .z .p{display:inline-flex;flex-direction:column;pointer-events:none}
.sb .z .nb{display:inline-flex;align-items:flex-end;gap:0 2px}
.sb.wide{max-width:352px}
.sb .z .p i{visibility:hidden}
.sb .lis{display:none;align-items:center;gap:6px;font:800 16px var(--ui);color:var(--sky);padding:6px 2px;white-space:nowrap}
.sb .lis svg{width:20px;height:20px}
.sb.aonly .lis{display:flex}
.sb.aonly .z{display:none}
.sb .side{display:flex;gap:5px;flex:0 0 auto;align-self:center}
.sb .ib{width:32px;height:32px;border-radius:10px;background:#F3E8D2;display:grid;place-items:center;font:900 11px var(--ui)}
.sb .ib svg{width:17px;height:17px}
.sb .e{font:700 11.5px/1.3 var(--ui);color:var(--ink2);margin-top:2px}
.noen .sb .e{display:none}
.noen .sb.showen .e{display:block}
.sb .pat{height:6px;border-radius:3px;background:#EFE4CC;overflow:hidden;margin-top:5px}
.sb .pat i{display:block;height:100%;background:var(--leaf);transition:width .25s linear}
.sb .pat i.mid{background:var(--gold)}
.sb .pat i.low{background:var(--red)}
.sb.out,.lab.out{animation:fade .25s ease forwards}
@keyframes pop{0%{opacity:0;transform:var(--t) scale(.6)}100%{opacity:1;transform:var(--t) scale(1)}}
@keyframes fade{to{opacity:0}}
.nopy .sb i,.nopy .tag i,.nopy .choice i,.nopy #ride i{visibility:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:5px 11px 6px;text-align:center;box-shadow:0 4px 0 rgba(58,42,31,.2);white-space:nowrap;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
.lab::after{content:"";position:absolute;left:var(--ax,50%);bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.lab .z{font:700 19px/1.15 var(--zh)}
.lab .p{font:600 12px/1.2 var(--py);color:var(--leaf-d)}
.lab .e{font:700 11px/1.2 var(--ui);color:var(--ink2)}
.lab.warn{border-color:var(--red)}
.lab.warn::after{border-color:var(--red)}
.ripple{position:absolute;width:34px;height:14px;margin:-7px 0 0 -17px;border:3px solid rgba(255,255,255,.9);border-radius:50%;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.float{position:absolute;z-index:30;pointer-events:none;font:900 22px var(--ui);color:var(--gold-d);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:flt 1.1s ease-out forwards;white-space:nowrap}
.float.bad{color:var(--red)}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
#guide{position:absolute;left:12px;right:12px;top:58px;z-index:22;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);border:2px solid var(--sky-l);border-radius:18px;padding:8px 12px 8px 8px;box-shadow:0 6px 16px rgba(40,60,90,.16);animation:gin .35s cubic-bezier(.3,1.4,.5,1)}
#guide img{width:40px;height:auto;flex:0 0 auto}
#guide .gt{font:700 14px/1.4 var(--ui)}
#guide .gt b{font-weight:900}
#guide.out{animation:gout .3s ease forwards}
#guide .gok{margin-left:auto;height:38px;padding:0 16px;border-radius:12px;background:var(--sky);color:#fff;font:900 14px var(--ui);flex:0 0 auto;box-shadow:0 3px 0 var(--sky-d)}
@keyframes gin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes gout{to{opacity:0;transform:translateY(-10px)}}

/* ---------- shop controls ---------- */
#shopui{position:absolute;inset:0;z-index:14;pointer-events:none}
#shopui>*{pointer-events:auto}
#give{position:absolute;right:12px;height:50px;padding:0 22px;border-radius:16px;background:var(--leaf);color:#fff;font:900 17px var(--ui);box-shadow:0 4px 0 var(--leaf-d),0 8px 16px rgba(34,134,62,.3)}
#give:disabled{background:#CDBFA6;box-shadow:0 4px 0 #AF9F84}
#give.pulse{animation:gpulse 1s ease-in-out infinite}
@keyframes gpulse{50%{transform:scale(1.1)}}
#clearTray{position:absolute;left:12px;height:40px;padding:0 13px;border-radius:13px;background:rgba(255,250,238,.95);border:2px solid #E3CFA5;font:800 13px var(--ui)}
#choices{position:absolute;left:12px;right:12px;display:flex;gap:8px;justify-content:center}
.choice{flex:1;max-width:124px;height:64px;border-radius:16px;background:#fff;border:2.5px solid var(--sky);box-shadow:0 4px 0 var(--sky-d);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:up .25s cubic-bezier(.3,1.3,.5,1) backwards}
.choice:nth-child(2){animation-delay:.05s}.choice:nth-child(3){animation-delay:.1s}
.choice b{font:700 22px/1.1 var(--zh)}
.choice i{font:600 11px var(--py);font-style:normal;color:var(--ink2)}
.choice.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s}
.choice.good{border-color:var(--leaf);background:var(--mint)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#gameui{position:absolute;inset:0;z-index:14;pointer-events:none}
#gameui>*{pointer-events:auto}
.gbar{position:absolute;left:12px;right:12px;bottom:14px;display:flex;align-items:center;gap:10px}
.gbtn{flex:1;height:54px;border-radius:17px;background:var(--leaf);color:#fff;font:900 18px var(--ui);box-shadow:0 4px 0 var(--leaf-d),0 8px 16px rgba(34,134,62,.3)}
.gbtn:disabled{background:#CDBFA6;box-shadow:0 4px 0 #AF9F84}
.gbtn.alt2{background:#fff;color:var(--sky);border:2.5px solid var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.gbtn.alt2:disabled{color:#B9AE9B;border-color:#D8CCB5;box-shadow:none;background:rgba(255,255,255,.8)}
.gnote{flex:1;height:54px;border-radius:17px;background:rgba(255,250,238,.95);border:2px solid #F0DDB4;display:grid;place-items:center;font:800 15px var(--ui);color:var(--ink2)}
.rbtn{width:54px;height:54px;border-radius:17px;background:rgba(255,250,238,.97);border:2px solid #F0DDB4;display:grid;place-items:center;color:var(--sky);box-shadow:0 4px 12px rgba(58,42,31,.16);flex:0 0 auto}
.rbtn svg{width:24px;height:24px}
.ampm{position:absolute;left:12px;right:12px;bottom:82px;display:flex;gap:10px;justify-content:center}
.ampm button{flex:1;max-width:150px;height:58px;border-radius:16px;background:#fff;border:2.5px solid var(--sky);box-shadow:0 4px 0 var(--sky-d);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ampm button b{font:700 21px/1.1 var(--zh)}
.ampm button i{font:600 11px var(--py);font-style:normal;color:var(--ink2)}
.ampm button.on{background:var(--sky);color:#fff}
.ampm button.on i{color:#DCEBFB}
.board{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 8px;overflow:hidden}
.board .cl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 3px;text-align:left;color:#F4F8EE;border-radius:8px;padding:1px 4px}
.board .cl .w{display:inline-flex;flex-direction:column;align-items:center}
.board .cl i{font:600 10px/1.2 var(--py);font-style:normal;color:#CFE6C8;min-height:12px}
.board .cl b{font:500 21px/1.2 var(--zh);text-shadow:0 1px 0 rgba(0,0,0,.25);border-radius:5px;padding:0 1px}
.board .cl .w.on b{background:#FFE27A;color:#3A2A1F;text-shadow:none}
.board .cl.on{background:rgba(255,255,255,.1)}
.board .lis{display:flex;align-items:center;gap:6px;font:800 16px var(--ui);color:#F4F8EE;padding:3px 0}
.board .lis svg{width:18px;height:18px}
.cards{position:absolute;left:12px;right:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cards.c3{grid-template-columns:repeat(3,1fr);left:28px;right:28px}
.card{position:relative;aspect-ratio:.86;border-radius:15px;background:#FFF8EA;border:2.5px solid #EAD9B5;box-shadow:0 4px 0 #D9C49B;display:grid;place-items:center;overflow:hidden;transition:transform .15s}
.card img{width:96%;height:auto}
.card.down{background:#DAD3C5;border-color:#C9C0AE;box-shadow:none}
.card.down img{opacity:.13;filter:grayscale(1)}
.card.down::after{content:"?";position:absolute;font:900 34px var(--ui);color:#A79C88}
.card.win{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,181,68,.55),0 4px 0 var(--gold-d);transform:scale(1.07)}
.card.bad{animation:shake .4s}
.kpanel{position:absolute;left:12px;right:12px;bottom:82px;display:flex;flex-direction:column;gap:8px}
.krow{display:flex;align-items:center;gap:10px;background:rgba(255,251,240,.97);border:2px solid #EAD9B5;border-radius:16px;padding:6px 10px;box-shadow:0 3px 8px rgba(58,42,31,.15)}
.krow img{width:42px;height:42px;object-fit:contain}
.krow .nm{flex:1;display:flex;flex-direction:column;align-items:flex-start}
.krow .nm b{font:700 18px/1.15 var(--zh)}
.krow .nm i{font:600 11px var(--py);font-style:normal;color:var(--ink2)}
.step{width:44px;height:44px;border-radius:50%;background:#F3E8D2;font:900 24px/1 var(--ui);color:var(--ink);box-shadow:0 3px 0 #D9CBB0}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;background:#E6DAC2}
.dots i.on{background:var(--gold)}
.temp{display:flex;gap:8px}
.temp button{width:60px;height:50px;border-radius:13px;background:#fff;border:2.5px solid #E3CFA5;display:flex;flex-direction:column;align-items:center;justify-content:center}
.temp button b{font:700 19px/1.1 var(--zh)}
.temp button i{font:600 10px var(--py);font-style:normal;color:var(--ink2)}
.temp button.on.hot{background:#FFE1DC;border-color:var(--red)}
.temp button.on.cold{background:var(--sky-l);border-color:var(--sky)}
.nopy .board i,.nopy .krow i,.nopy .temp i,.nopy .ampm i{visibility:hidden}
#ride{position:absolute;left:10px;right:10px;bottom:10px;z-index:15;display:flex;align-items:center;gap:10px;background:rgba(255,252,242,.97);border:2.5px solid var(--gold);border-radius:18px;padding:7px 8px 7px 10px;box-shadow:0 6px 16px rgba(58,42,31,.25);animation:up .25s cubic-bezier(.3,1.3,.5,1)}
#ride .face{width:44px;height:44px;border-radius:50%;background:#FCEBD2 center/cover;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);flex:0 0 auto}
#ride .rt{min-width:0;flex:1}
#ride .rh{font:800 12px var(--ui);color:var(--ink2)}
#ride .rh b{color:var(--ink)}
#ride .rz{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 2px}
#ride .rz span{display:inline-flex;flex-direction:column;align-items:center}
#ride .rz .nb{flex-direction:row;align-items:flex-end;gap:0 2px}
#ride .rz i{font:600 10px/1.2 var(--py);font-style:normal;color:var(--ink2)}
#ride .rz b{font:500 21px/1.2 var(--zh);border-radius:5px;padding:0 1px}
#ride .rz .on b{background:var(--leaf);color:#fff}
#ride .lis{font:800 16px var(--ui);color:var(--sky);padding:4px 0;display:flex;align-items:center;gap:8px}
#ride .peek{height:28px;padding:0 10px;border-radius:9px;background:#F3E8D2;color:var(--ink);font:800 12px var(--ui)}
#ride .say{width:46px;height:46px;border-radius:14px;background:var(--sky);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 3px 0 var(--sky-d)}
#ride .say svg{width:22px;height:22px}

/* ---------- sheets ---------- */
.modal{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(40,28,18,.42);animation:fin .2s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
.sheet{position:relative;background:linear-gradient(180deg,#FFFDF7,#FFF6E4);border-top:3px solid var(--gold);border-radius:26px 26px 0 0;max-height:90%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.3,1.2,.5,1);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.sh-h .face{width:52px;height:52px;border-radius:50%;background:#FCEBD2 center/cover;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);flex:0 0 auto}
.sh-h h2{margin:0;font:900 25px/1.15 var(--ui)}
.sh-h h2 small{display:block;font:800 12px/1.4 var(--ui);color:var(--ink2)}
.x{margin-left:auto;width:40px;height:40px;border-radius:13px;background:#F3E8D2;display:grid;place-items:center;flex:0 0 auto}
.x svg{width:18px;height:18px}
.sh-b{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.how{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font:700 14px/1.5 var(--ui);color:var(--ink2);margin-bottom:12px}
.how b{color:var(--ink)}
.how .goal{display:block;margin-top:4px;color:var(--gold-d)}
.days{display:flex;flex-direction:column;gap:9px}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2.5px solid var(--gold);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--gold-d)}
.day .dn{font:900 18px var(--ui);color:var(--gold-d);min-width:52px}
.day .dt{flex:1;min-width:0;font:700 14px/1.35 var(--ui)}
.stars{display:flex;gap:2px;flex:0 0 auto}
.stars svg{width:20px;height:20px}
.day.lock{border-color:#D8C9AA;box-shadow:none;background:#F5EFE3;color:var(--ink3)}
.day.lock .dn{color:var(--ink3)}
.res{text-align:center;padding:12px 16px 6px}
.res h2{margin:0;font:900 32px/1.2 var(--ui);color:var(--sky)}
.res .big{display:flex;justify-content:center;gap:6px;margin:10px 0}
.res .big svg{width:48px;height:48px}
.res .row{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.res .row div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-width:86px}
.res .row b{display:block;font:900 22px var(--ui)}
.res .row span{font:800 12px var(--ui);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid var(--leaf);background:var(--mint);border-radius:10px;padding:2px 8px 3px}
.chip b{font:500 16px/1.2 var(--zh)}
.chip i{font:600 10px var(--py);font-style:normal;color:var(--leaf-d)}
.chip.no{border:1.5px dashed #D9C9AA;background:#fff;color:#C9BBA3}
.chip.no i{color:#D2C4AC}
.bigbtn{width:100%;height:52px;border-radius:16px;background:var(--leaf);color:#fff;font:800 16px var(--ui);box-shadow:0 4px 0 var(--leaf-d);margin-top:12px}
.bigbtn.alt{background:#F3E8D2;color:var(--ink);box-shadow:0 4px 0 #D9CBB0}
.sect{font:800 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:14px 2px 8px}
.prog{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;font:800 13px var(--ui)}
.prog .bar{flex:1;height:10px;border-radius:5px;background:#EFE4CC;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F4CC61)}
.prog b{font:900 14px var(--ui)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1.5px solid var(--line)}
.opt .z{font:800 16px var(--ui)}
.opt .e{font:700 12px var(--ui);color:var(--ink2)}
.opt .seg{margin-left:auto;display:flex;background:#F3E8D2;border-radius:12px;padding:3px;flex:0 0 auto}
.opt .seg button{border-radius:9px;padding:7px 11px;font:800 13px var(--ui)}
.opt .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.danger{margin-top:16px;width:100%;height:46px;border-radius:14px;border:2px solid #F2C4BD;background:#FFF4F2;color:#B43B2E;font:800 14px var(--ui)}

/* ---------- map ---------- */
#map{position:absolute;inset:0;z-index:45;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#9FD27A}
#mapin{position:relative;width:100%}
#mapin>img{width:100%;height:auto}
.mtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(180deg,rgba(255,252,242,.97),rgba(255,252,242,.9));border-bottom:2px solid #F0DDB4;margin-bottom:-60px}
.mtop h1{margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:900 26px/1 var(--ui);color:var(--sky);text-shadow:0 2px 0 #fff}
.district{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,252,242,.96);border:2.5px solid #F0DDB4;border-radius:18px;padding:8px 16px 9px;box-shadow:0 6px 16px rgba(40,50,30,.22);min-width:190px;text-align:center}
.district b{font:900 17px var(--ui)}
.district .dl{font:900 11px var(--ui);letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.district .bar{width:150px;height:8px;border-radius:4px;background:#EFE4CC;overflow:hidden}
.district .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F4CC61)}
.district .lk{display:flex;align-items:center;gap:5px;font:800 12px var(--ui);color:var(--ink2)}
.district.locked{background:rgba(245,242,236,.94)}
.pin{position:absolute;width:max-content;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;animation:bob 2.2s ease-in-out infinite}
.pin .pb{display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--sky);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:0 5px 12px rgba(30,60,100,.28);font:900 15px var(--ui);white-space:nowrap;text-align:left;transform:translateX(var(--dx,0px))}
.pin .pb>span{display:flex;flex-direction:column;align-items:flex-start}
.pin .pb .st{display:flex;align-items:center;gap:3px}
.pin .pb .st svg{width:12px;height:12px}
.pin .pb img{width:30px;height:30px;border-radius:50%;background:var(--sky-l)}
.pin .pb small{font:800 11px var(--ui);color:var(--ink2);display:block;white-space:nowrap}
.pin::after{content:"";width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--sky);margin-top:-1px}
.pin.soon .pb{border-color:#BFB2A0;color:var(--ink2)}
.pin.soon::after{border-top-color:#BFB2A0}
@keyframes bob{50%{transform:translate(-50%,-106%)}}
/* ---------- the long map: pins can hang under their building, HSK 2 is orange, banners sit on the joins ---------- */
#mapin>img{display:block}
.pin.up{transform:translate(-50%,0);flex-direction:column-reverse}
.pin.up::after{border-top:0;border-bottom:12px solid var(--sky);margin-top:0;margin-bottom:-1px}
.pin.up.cur{animation-name:bobup}
@keyframes bobup{50%{transform:translate(-50%,-6%)}}
.pin.lv2 .pb{border-color:#EF7B2C;box-shadow:0 3px 8px rgba(120,60,20,.25)}
.pin.lv2::after{border-top-color:#EF7B2C}
.pin.lv2.up::after{border-bottom-color:#EF7B2C}
.pin.lv2 .pb img{background:#FDE6D2}
.district.band{flex-direction:row;align-items:center;gap:8px;padding:7px 16px 7px 14px;min-width:0;width:max-content;white-space:nowrap;border-radius:999px;border-width:2px;transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(40,50,30,.22)}
.district.band .dl{font-size:11px;letter-spacing:.08em}
.district.band b{font-size:17px}
.district.band .bar{width:64px;height:7px}
.district.band .lk{font-size:12px}
.district.band.lv2 .dl{color:#EF7B2C}
.district.band.lv2 .bar i{background:#EF7B2C}
/* ---------- inside the KanChinese app (?embed=1, Figma 743:2) ---------- */
.mtop .mx{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.95);border:2px solid #F0DDB4;flex:0 0 auto;padding:0}
.mtop .mx svg{width:16px;height:16px}
.mribw{position:sticky;top:64px;height:0;z-index:5}
.mrib{margin:0 12px;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 12px;border-radius:999px;background:#FFF6DD;border:2px solid var(--gold);box-shadow:0 3px 8px rgba(64,51,26,.18)}
.mrib.over{background:#F3EFE8;border-color:#D6CBB8}
.mrib>svg{width:16px;height:16px;flex:0 0 auto}
.mrib .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mrib .t b,.mrib .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrib .t b{font:900 14px/1.2 var(--ui);color:var(--ink)}
.mrib .t small{font:800 11px/1.25 var(--ui);color:var(--ink2)}
.mrib button{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--gold);font:900 13px var(--ui);color:var(--ink)}
.pin.lock .pb{background:#F7F4EE;border-color:#BFB2A0;color:var(--ink2);box-shadow:0 3px 8px rgba(64,51,26,.18)}
.pin.lock::after{border-top-color:#BFB2A0}
.pin.lock.up::after{border-bottom-color:#BFB2A0}
.pin.lock .pb img{opacity:.55;background:#E9E4DA}
.pin.lock .fc em{background:#DDD4C4;color:#7D7263}
.day.wait{opacity:.7}
/* ---------- tap a word: what it means, and keep it ---------- */
#wcard{position:absolute;z-index:95;left:12px;right:12px;max-width:380px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 10px;border-radius:18px;background:#FFFCF2;border:2px solid var(--gold);box-shadow:0 8px 22px rgba(58,42,31,.28);animation:wcIn .16s ease-out}
#wcard[hidden]{display:none}
@keyframes wcIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#wcard .wc-say{flex:0 0 auto;width:42px;height:42px;border-radius:21px;background:#fff;border:2px solid #F0DDB4;display:grid;place-items:center;color:var(--sky)}
#wcard .wc-say svg{width:20px;height:20px}
#wcard .wc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#wcard .wc-t b{font:700 24px/1.15 var(--zh);color:var(--ink)}
#wcard .wc-t i{font:600 13px/1.2 var(--py);font-style:normal;color:var(--ink2)}
#wcard .wc-t span{font:800 13px/1.3 var(--ui);color:var(--ink)}
#wcard .wc-save{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--leaf);color:#fff;font:900 13px var(--ui);box-shadow:0 3px 0 var(--leaf-d)}
#wcard .wc-save.done{background:#E3F7F0;color:#1B8A5A;box-shadow:none}
#wcard .wc-x{flex:0 0 auto;align-self:flex-start;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--ink2)}
#wcard .wc-x svg{width:14px;height:14px}
.rz .sg{cursor:pointer}

/* ---------- title ---------- */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;background:linear-gradient(180deg,rgba(210,232,250,.92),rgba(246,242,232,.95)),url(img/bg_map.webp) center 80%/cover}
#title h1{margin:0;font:900 54px/1 var(--ui);color:var(--sky);letter-spacing:-.01em;text-shadow:0 3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 -3px 0 #fff,0 7px 0 rgba(40,60,90,.22);text-align:center}
#title .py{font:700 15px/1 var(--zh);letter-spacing:.2em;color:var(--ink2);text-align:center;margin-top:10px}
#title .cast{display:flex;align-items:flex-end;justify-content:center;gap:4px}
#title .cast img{height:62px;width:62px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
#title .tag2{background:rgba(255,252,245,.96);border:2px solid #F0DDB4;border-radius:20px;padding:12px 16px;max-width:340px;text-align:center}
#title .tag2 .z{font:800 17px/1.4 var(--ui)}
#title .tag2 .e{font:700 13px/1.45 var(--ui);color:var(--ink2);margin-top:4px}
#startBtns{width:min(100%,300px)}
#title .note{font:700 11.5px/1.4 var(--ui);color:var(--ink2);text-align:center}

/* ---------- the route on the town map ---------- */
.pin{animation:none}
.pin.cur{animation:bob 2.2s ease-in-out infinite}
.pin .fc{position:relative;display:block;width:30px;height:30px;flex:0 0 auto}
.pin .fc em{position:absolute;left:-8px;top:-8px;min-width:19px;height:19px;border-radius:10px;background:var(--gold);color:#3A2A1F;font:900 10.5px/15px var(--ui);font-style:normal;text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin.soon img{filter:grayscale(1);opacity:.75}
.pin.soon .fc em{background:#DDD4C4;color:#7D7263}
.pin.soon .pb{background:#F7F4EE}
.pin .pb{gap:5px;border-width:2px;padding:3px 10px 3px 3px;font:900 12.5px/1.15 var(--ui);box-shadow:0 3px 8px rgba(30,60,100,.25)}
.pin .pb img,.pin .fc{width:24px;height:24px}
.pin .pb small{font:800 9.5px/1.25 var(--ui)}
.pin .pb .st svg{width:10px;height:10px}
.pin::after{border-left-width:7px;border-right-width:7px;border-top-width:9px}
.pin .fc em{left:-6px;top:-6px;min-width:15px;height:15px;border-radius:8px;font:900 9px/11px var(--ui)}
.pin.cur .pb{border-color:var(--gold);box-shadow:0 0 0 4px rgba(246,196,67,.4),0 5px 12px rgba(30,60,100,.28)}
.pin.cur::after{border-top-color:var(--gold)}
.pin.shake{animation:pshake .4s}
@keyframes pshake{20%{margin-left:-6px}40%{margin-left:6px}60%{margin-left:-4px}80%{margin-left:3px}}
.mtoast{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:86%;width:max-content;background:rgba(58,42,31,.92);color:#fff;font:800 14px/1.3 var(--ui);padding:10px 16px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.25);text-align:center;pointer-events:none}
/* ---------- bakery ---------- */
.bkpanel{position:absolute;left:12px;right:12px;bottom:82px;display:flex;flex-direction:column;gap:8px}
.bksize{display:flex;gap:10px}
.bksize button{flex:1;height:76px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,251,240,.97);border:2.5px solid #EAD9B5;border-radius:18px;box-shadow:0 4px 0 #D9C49B}
.bksize button img{height:54px;width:auto}
.bksize button span{display:flex;flex-direction:column;align-items:center}
.bksize button b{font:700 27px/1.1 var(--zh)}

.bkcand{display:flex;align-items:center;gap:10px;background:rgba(255,251,240,.97);border:2px solid #EAD9B5;border-radius:16px;padding:7px 10px;box-shadow:0 3px 8px rgba(58,42,31,.15)}

.cd{position:relative;width:8px;height:25px;border-radius:2px;border:1.5px solid #6B4A2E;background:repeating-linear-gradient(160deg,#F48FB1 0 5px,#fff 5px 7px)}

.cd.c1{background:repeating-linear-gradient(160deg,#7CC8F2 0 5px,#fff 5px 7px)}
.cd.c2{background:repeating-linear-gradient(160deg,#FFD84D 0 5px,#fff 5px 7px)}
.cd.c3{background:repeating-linear-gradient(160deg,#8FD48A 0 5px,#fff 5px 7px)}

/* ---------- phone booth ---------- */
.phpanel{position:absolute;left:10px;right:10px;bottom:80px;background:rgba(255,250,238,.97);border:2.5px solid #EAD9B5;border-radius:22px;padding:10px 12px 12px;box-shadow:0 6px 18px rgba(58,42,31,.2)}
.phhint{display:flex;justify-content:center;align-items:baseline;gap:10px;margin:-2px 0 6px}

.sb.fromphone{border-color:#7FB3EA;background:#F4F9FF}
.sb.fromphone::after{border-color:#7FB3EA;background:#F4F9FF}
