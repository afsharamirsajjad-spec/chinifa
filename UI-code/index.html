<style id="chinifa-splash-critical-css">
#chinifa-splash {
  position: absolute;
  inset: 0;
  z-index: 999999;
  background: radial-gradient(circle at 50% 34%, #10B981 0%, #059669 48%, #044E36 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  opacity: 1;
  transition: opacity 0.24s cubic-bezier(0.4, 0, 0.2, 1), transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: opacity, transform;
}
#chinifa-splash.is-out {
  opacity: 0 !important;
  transform: scale(1.03) !important;
  pointer-events: none !important;
  visibility: hidden !important;
}
.chinifa-splash-center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 24px;
}
.chinifa-emblem-wrap {
  position: relative;
  width: 132px;
  height: 132px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: chinifaFloat 2.6s ease-in-out infinite;
}
.chinifa-emblem-glow {
  position: absolute;
  inset: -22px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(253, 230, 138, 0.35) 0%, rgba(16, 185, 129, 0) 70%);
  pointer-events: none;
}
.chinifa-emblem-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: chinifaSpin 14s linear infinite;
}
.chinifa-emblem-core {
  position: relative;
  width: 96px;
  height: 96px;
  border-radius: 28px;
  background: linear-gradient(145deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%);
  border: 1.5px solid rgba(253, 230, 138, 0.55);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24), inset 0 1px 1px rgba(255, 255, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-4deg);
}
.chinifa-emblem-svg {
  width: 58px;
  height: 58px;
  transform: rotate(4deg);
}
.chinifa-splash-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 44px;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
  color: #FFFFFF;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  margin: 0;
}
.chinifa-splash-sub {
  margin-top: 10px;
  font-size: 14px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.92);
  letter-spacing: 0.2px;
}
.chinifa-splash-bar {
  margin-top: 26px;
  width: 136px;
  height: 4px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.2);
  overflow: hidden;
  position: relative;
}
.chinifa-splash-bar i {
  display: block;
  width: 55%;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, rgba(253,230,138,0.4), #FDE68A, #FFFFFF);
  animation: chinifaBar 1.15s ease-in-out infinite;
}
@keyframes chinifaFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes chinifaSpin {
  to { transform: rotate(360deg); }
}
@keyframes chinifaBar {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(220%); }
}

      <script>
        (function() {
          var s = document.getElementById('chinifa-splash');
          if (!s) return;
          var dismissed = false;

          window.__dismissSplash = function() {
            if (dismissed || !s) return;
            dismissed = true;
            try { s.style.pointerEvents = 'none'; } catch(e) {}
            s.classList.add('is-out');
            setTimeout(function() {
              try {
                if (s && s.parentNode) s.parentNode.removeChild(s);
              } catch(e) {}
            }, 250);
          };

          s.addEventListener('click', window.__dismissSplash);
          s.addEventListener('touchstart', window.__dismissSplash, { passive: true });

          // گارد ایمنی نهایی در صورت بروز خطای غیرمنتظره
          setTimeout(window.__dismissSplash, 3500);
        })();
      </script>
