<style id="chinifa-splash-critical-css">
#chinifa-splash {
  position: absolute;
  inset: 0;
  z-index: 999999;
  background: radial-gradient(circle at 50% 38%, #10B981 0%, #059669 45%, #064E3B 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  opacity: 1;
  transition: opacity 0.3s ease-out, transform 0.3s ease-out;
}
#chinifa-splash.is-out {
  opacity: 0 !important;
  transform: scale(1.03) !important;
  pointer-events: none !important;
  visibility: hidden !important;
}
.chinifa-mascot-container {
  position: relative;
  width: 200px;
  height: 246px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
}
.chinifa-splash-dragon-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.38));
  display: block;
}
.chinifa-splash-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 52px;
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1;
  color: #FFFFFF;
  text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), 0 0 24px rgba(254, 240, 138, 0.7);
  opacity: 1;
  margin: 0;
  padding: 0;
  text-align: center;
}
.chinifa-splash-sub {
  margin-top: 10px;
  font-size: 15px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.94);
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  letter-spacing: 0.3px;
  opacity: 1;
  text-align: center;
}
</style>

  <div class="stage">

      <!-- Chinifa Splash Screen with Stable Dragon Mascot & Title -->

        <div class="chinifa-splash-bg">

        <div class="chinifa-splash-center">
          <!-- اژدهای اصلی چی‌نی‌فا با تصویر کامل و درخشش ملایم -->
          <div class="chinifa-mascot-container">
            <div class="chinifa-splash-glow"></div>
            <img class="chinifa-splash-dragon-img" src="art/splash_dragon_mascot.png" alt="chinifa dragon" decoding="async">
          </div>
          <div class="chinifa-splash-title" dir="ltr">chinifa</div>
          <div class="chinifa-splash-sub">آموزش هوشمند زبان چینی 🌸</div>
        </div>
      </div>
      <script>
        (function() {
          var s = document.getElementById('chinifa-splash');
          if (!s) return;
          var dismissed = false;
          var minDuration = 200; // لود آنی و پرسرعت برای وب‌اپلیکیشن
          var startTime = Date.now();

          window.__dismissSplash = function(force) {
            if (dismissed || !s) return;
            var elapsed = Date.now() - startTime;
            if (!force && elapsed < minDuration) {
              setTimeout(function() { window.__dismissSplash(true); }, minDuration - elapsed);
              return;
            }
            dismissed = true;
            try { s.style.pointerEvents = 'none'; } catch(e) {}
            s.classList.add('is-out');
            setTimeout(function() {
              try {
                if (s) {
                  s.style.display = 'none';
                  if (s.parentNode) s.parentNode.removeChild(s);
                }
              } catch(e) {}
            }, 200);
          };

          // لمس یا کلیک فوری برای عبور کاربر در صورت تمایل
          s.addEventListener('click', function() { window.__dismissSplash(true); });
          s.addEventListener('touchstart', function() { window.__dismissSplash(true); }, { passive: true });

          // بستن خودکار اسپلش پس از سپری شدن زمان آماده‌سازی
          setTimeout(function() {
            window.__dismissSplash(false);
          }, minDuration);

          // گارد ایمنی نهایی در صورت هرگونه تاخیر مرورگر
          setTimeout(function() {
            window.__dismissSplash(true);
          }, 2000);
        })();
      </script>
