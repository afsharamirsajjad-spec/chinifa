<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chinifa (چی‌نی‌فا) — اپلیکیشن آموزش هوشمند زبان چینی</title>
  <meta http-equiv="refresh" content="0;url=/website/">
  <script>
    // انتقال فوری و بدون تاخیر به وب‌سایت اصلی
    var target = "/website/" + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    body {
      margin: 0;
      background: #0b121a;
      color: #d9e4ef;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: #131d29;
      border: 1px solid #22303f;
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(43,209,157,0.2);
      border-top-color: #2bd19d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 10px; font-size: 19px; color: #fff; }
    p { margin: 0 0 16px; font-size: 13.5px; color: #8ba0b5; }
    a {
      color: #2bd19d;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>سامانه آموزشی chinifa (چی‌نی‌فا)</h2>
    <p>در حال بارگذاری و انتقال به وب‌سایت رسمی...</p>
    <a href="/website/">اگر به‌صورت خودکار منتقل نشدید، اینجا کلیک کنید &larr;</a>
  </div>
</body>
</html>
