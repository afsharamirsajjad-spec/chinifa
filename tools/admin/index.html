<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل ادمین Chinify</title>
<style>
@font-face{font-family:Vazirmatn;src:url(/admin/fonts/vazir.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#0b121a;--bg2:#0e1721;--panel:#131d29;--panel2:#182635;
  --line:#22303f;--line2:#2e4053;
  --txt:#d9e4ef;--mut:#8ba0b5;--dim:#5e7388;
  --acc:#2bd19d;--acc-ink:#04241a;--acc-soft:rgba(43,209,157,.12);
  --danger:#ff8b7b;--warn:#f5b95f;--info:#6fb3ff;
  --r:14px;--side:288px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26364a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.layout{display:grid;grid-template-columns:var(--side) 1fr;height:100vh}
/* ---------- sidebar ---------- */
.side{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2bd19d,#128f6c);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#04241a}
.brand h1{font-size:15px;margin:0;color:#fff}
.brand .sub{font-size:10.5px;color:var(--dim);margin:2px 0 0}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav .grp{color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:14px 10px 6px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:none;color:var(--mut);
  padding:8.5px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;margin:1px 0}
.nitem:hover{background:var(--panel);color:var(--txt)}
.nitem.on{background:var(--acc-soft);color:var(--acc);font-weight:700}
.nitem svg{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.nitem .cnt{margin-inline-start:auto;font-size:10.5px;background:var(--panel2);color:var(--dim);border-radius:20px;padding:1px 8px}
.nitem.on .cnt{background:rgba(43,209,157,.18);color:var(--acc)}
.sidefoot{border-top:1px solid var(--line);padding:10px 14px;font-size:11px;color:var(--dim)}
.sidefoot a{color:var(--mut)}

/* ---------- main / topbar ---------- */
.main{display:flex;flex-direction:column;overflow:hidden}
.top{padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:58px}
.top .title{font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.top .title .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
.top .title.dirty .dot{display:inline-block}
.top .sp{flex:1}
.top input.q{background:#0a1119;border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:10px;font-family:inherit;width:260px;min-width:140px}
.top input.q:focus{border-color:var(--acc);outline:none}
.body{flex:1;overflow:auto;padding:18px 22px 60px}

/* ---------- buttons / inputs ---------- */
.btn{background:var(--acc);border:none;color:var(--acc-ink);padding:8px 16px;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.gray{background:var(--panel2);color:var(--mut)}
.btn.gray:hover{color:var(--txt);filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--mut)}
.btn.ghost:hover{color:var(--txt);border-color:var(--acc)}
.btn.warnb{background:#3a2b12;color:var(--warn)}
.btn.dangb{background:#3a1a1a;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
input[type=text],input[type=number],select,textarea{background:#0a1119;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-family:inherit;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
.ltr{direction:ltr;text-align:left}
label{display:block;color:var(--dim);font-size:11.5px;margin-bottom:4px}

/* ---------- cards / grid ---------- */
.viewhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.viewhead h2{margin:0;font-size:18px;color:#fff}
.viewhead .sub{color:var(--dim);font-size:12px}
.viewhead .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.stat:hover{border-color:var(--line2);background:var(--panel2)}
.stat .n{font-size:24px;font-weight:800;color:#fff}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stat .s{font-size:10.5px;color:var(--dim);margin-top:4px;direction:ltr;text-align:left}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card:hover{border-color:var(--line2)}
.card.editing{border-color:var(--acc)}
.rowitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.rowitem:hover{border-color:var(--acc);background:var(--panel2)}
.rowitem .main-txt{flex:1;min-width:0}
.rowitem .t1{color:#fff;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .t2{color:var(--dim);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zh{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
.badge{display:inline-block;font-size:10.5px;border-radius:20px;padding:2px 9px;background:var(--panel2);color:var(--mut)}
.badge.acc{background:var(--acc-soft);color:var(--acc)}
.badge.warn{background:rgba(245,185,95,.14);color:var(--warn)}
.badge.dang{background:rgba(255,139,123,.14);color:var(--danger)}
.badge.info{background:rgba(111,179,255,.14);color:var(--info)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:5px 14px;cursor:pointer;font-family:inherit;font-size:12.5px}
.chip:hover{color:var(--txt)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
fieldset{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:10px 12px}
legend{color:var(--acc);font-size:12px;padding:0 6px;font-weight:700}
.fld{margin-bottom:9px}
.fld input,.fld textarea,.fld select{width:100%}
.fld textarea{min-height:52px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--mut);line-height:1.9;font-size:12.5px;margin-bottom:14px}
.hint b{color:var(--txt)}
.searchrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.searchrow input[type=text]{flex:1;min-width:180px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.empty{color:var(--dim);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:12px}
.wordrow{display:grid;grid-template-columns:70px 130px 1fr 90px 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.wordrow input{width:100%}
.farow{display:grid;grid-template-columns:220px 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.farow input{width:100%}
.del{background:#3a1a1a;color:var(--danger);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:12px}
.add{background:var(--acc-soft);color:var(--acc);border:1px dashed var(--acc);border-radius:9px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700}
textarea.raw{width:100%;height:calc(100vh - 230px);background:#0a1119;color:#d7e3ef;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left;white-space:pre;overflow:auto}
.blog{background:#0a1119;border:1px solid var(--line);border-radius:12px;padding:12px;height:44vh;overflow:auto;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut);white-space:pre-wrap}
.okc{color:var(--acc)}.badc{color:var(--danger)}.warnc{color:var(--warn)}
.sres{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;cursor:pointer}
.sres:hover{border-color:var(--acc)}
.sres .f{color:var(--acc);font-size:12px;direction:ltr;text-align:left}
.sres .h{color:var(--mut);font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl td,table.tbl th{border-bottom:1px solid var(--line);padding:7px 10px;text-align:right}
table.tbl th{color:var(--dim);font-size:11px}
table.tbl tr:hover td{background:var(--panel2)}
table.tbl input{width:100%;padding:5px 8px}
/* toasts */
#toasts{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);display:flex;flex-direction:column;gap:8px;z-index:99;align-items:center}
.toast{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:12px;padding:10px 18px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tin .18s ease}
.toast.ok{border-color:var(--acc);color:var(--acc)}
.toast.err{border-color:var(--danger);color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateX(50%) translateY(8px)}to{opacity:1}}
.thumb{width:74px;height:50px;object-fit:cover;border-radius:9px;background:#0a1119;flex:0 0 74px}
.cover{width:44px;height:60px;object-fit:cover;border-radius:8px;background:#0a1119;flex:0 0 44px}
.loadmore{width:100%;text-align:center;background:var(--panel);border:1px dashed var(--line2);color:var(--mut);padding:9px;border-radius:10px;cursor:pointer;font-family:inherit}
.loadmore:hover{color:var(--acc);border-color:var(--acc)}
.kbd{font-family:Consolas,monospace;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:0 6px;font-size:11px;direction:ltr;display:inline-block}
.dictgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.dictgrid button{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:6px 0;cursor:pointer;font-family:Consolas,monospace;font-size:12px;direction:ltr}
.dictgrid button:hover{border-color:var(--acc);color:var(--acc)}
.healthline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;color:var(--mut);border-bottom:1px dashed var(--line)}
.healthline:last-child{border-bottom:none}
.taskbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.sec>summary{cursor:pointer;padding:12px 16px;color:#fff;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--acc)}
details.sec[open]>summary{border-bottom:1px solid var(--line);color:var(--acc)}
details.sec[open]>summary::before{content:"▾"}
details.sec .secbody{padding:12px 16px}
details.ml{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.ml>summary{cursor:pointer;padding:10px 14px;color:var(--txt);font-size:13px;list-style:none;display:flex;gap:8px;align-items:center}
details.ml>summary::-webkit-details-marker{display:none}
details.ml>summary::before{content:"▸";color:var(--acc)}
details.ml[open]>summary{border-bottom:1px solid var(--line);color:var(--acc)}
details.ml[open]>summary::before{content:"▾"}
details.ml .mlbody{padding:10px 14px}
.excard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.excard:hover{border-color:var(--line2)}
.exhead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.optr{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.optr input[type=radio]{width:16px;height:16px;accent-color:var(--acc);flex:0 0 16px}
.optr input[type=text]{flex:1}
@media(max-width:1100px){.layout{grid-template-columns:250px 1fr}.wordrow{grid-template-columns:64px 110px 1fr 80px 1fr 34px}}

/* ---------- User Management, Analytics & Extended Controls ---------- */
.badge.vip{background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.4)}
.badge.active{background:rgba(43,209,157,0.15);color:#2bd19d;border:1px solid rgba(43,209,157,0.4)}
.badge.suspended{background:rgba(255,107,107,0.15);color:#ff6b6b;border:1px solid rgba(255,107,107,0.4)}
.badge.pending{background:rgba(245,185,95,0.15);color:#f5b95f;border:1px solid rgba(245,185,95,0.4)}
.badge.resolved{background:rgba(43,209,157,0.15);color:#2bd19d;border:1px solid rgba(43,209,157,0.4)}
.user-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;transition:border-color .15s}
.user-card:hover{border-color:var(--acc);background:var(--panel2)}
.user-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg, #134e4a, #065f46);color:#5eead4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 42px}
.user-info{flex:1;min-width:0}
.user-name{font-weight:700;font-size:14px;color:#fff;display:flex;align-items:center;gap:8px}
.user-meta{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.user-metrics{display:flex;align-items:center;gap:10px;margin-inline-start:auto;flex-wrap:wrap}
.metric-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.metric-pill.streak{color:#f5b95f;border-color:rgba(245,185,95,0.3)}
.metric-pill.xp{color:#a78bfa;border-color:rgba(167,139,250,0.3)}
.user-actions{display:flex;gap:6px;align-items:center}
.prog-bar{width:80px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;background:var(--acc);border-radius:3px}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.chart-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.chart-bars{display:flex;align-items:flex-end;gap:12px;height:160px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-col .bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--acc),#134e4a);border-radius:6px 6px 0 0;min-height:4px;transition:height .3s}
.chart-col .val{font-size:11px;color:var(--txt);font-weight:700}
.chart-col .lbl{font-size:11px;color:var(--dim);margin-top:4px;white-space:nowrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-win{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,0.6);animation:tin .2s ease-out}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px;color:#fff}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#admin-auth-gate{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 25%,#132a24 0%,#0b121a 70%);display:flex;align-items:center;justify-content:center;padding:20px}
#admin-auth-gate[hidden]{display:none !important}
.admin-auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,0.65)}
.admin-auth-card h2{margin:0 0 6px;font-size:20px;color:#fff;text-align:center}
.admin-auth-card p{margin:0 0 20px;font-size:12.5px;color:var(--mut);text-align:center}
.admin-auth-err{background:rgba(255,107,107,0.14);border:1px solid rgba(255,107,107,0.35);color:#ff8b7b;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.admin-auth-err[hidden]{display:none}
</style>
</head>
<body>
<div id="admin-auth-gate">
  <div class="admin-auth-card">
    <div style="width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:linear-gradient(135deg,#2bd19d,#128f6c);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#04241a">龙</div>
    <h2>ورود به پنل مدیریت چینی‌فا</h2>
    <p>برای مشاهده و مدیریت کاربران و دیتابیس وارد شوید</p>
    <div class="admin-auth-err" id="adminAuthErr" hidden></div>
    <form id="adminAuthForm">
      <div class="fld">
        <label>نام کاربری</label>
        <input type="text" id="adminUserIn" value="admin" autocomplete="username" required dir="ltr">
      </div>
      <div class="fld">
        <label>رمز عبور</label>
        <input type="password" id="adminPassIn" placeholder="رمز عبور ادمین" autocomplete="current-password" required dir="ltr" style="width:100%;background:#0a1119;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px">
      </div>
      <button type="submit" class="btn" id="adminAuthSubmit" style="width:100%;justify-content:center;padding:10px 16px;margin-top:6px">ورود به پنل</button>
    </form>
  </div>
</div>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="logo">中</div>
      <div><h1>پنل ادمین chinifa (چی‌نی‌فا)</h1><div class="sub">کاربران · آمار · محتوا · ساخت APK</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <div><span id="sfVer">…</span></div>
      <div style="margin-top:4px"><a href="/app/index.html" target="_blank">پیش‌نمایش اپ ↗</a> · <span class="kbd">Ctrl+S</span> ذخیره</div>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="title" id="vtitle"><span class="dot"></span><span id="vtitleTxt">داشبورد</span></div>
      <div class="sp"></div>
      <span class="badge" id="dbStatusBadge">⏳ در حال بررسی دیتابیس...</span>
      <input class="q" id="gq" placeholder="🔍 جستجو در همهٔ محتوا… (Enter)">
      <a class="btn ghost" href="../../website/" target="_blank" title="مشاهده وب‌سایت معرفی">🌐 وب‌سایت</a>
      <button class="btn" id="saveBtn" onclick="saveAll()">💾 ذخیره</button>
      <button class="btn dangb sm" onclick="adminLogout()" title="خروج از پنل">خروج</button>
      <a class="btn gray" href="#/build">🔨 ساخت APK</a>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<div id="toasts"></div>
<script>
"use strict";
/* ============================================================
   Chinify Admin v2 — بازطراحی کامل بر پایهٔ محتوای جدید:
   درس‌ها (hsk1-4+worket) · داستان‌ها · پادکست‌ها · کتابخانه · کلیپ‌ها
   ============================================================ */
const $ = s => document.querySelector(s);
const body = $("#body");
const enc = encodeURIComponent;
const FA_PATH = "content/i18n/fa.json";

let STATS = null;
let FA = null, faPromise = null;

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg, type){
  const t = el("div", "toast " + (type || ""), esc(msg));
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
function mediaURL(u){
  u = u || "";
  if(!u) return "";
  if(/^https?:/.test(u) || u.startsWith("data:")) return u;
  return "/app/" + u.replace(/^\/+/, "");
}
function fmtSize(n){
  if(!n) return "";
  if(n > 1048576) return (n/1048576).toFixed(1) + " MB";
  if(n > 1024) return (n/1024).toFixed(0) + " KB";
  return n + " B";
}

/* ---------- dirty tracking / save ---------- */
function touch(path, obj){ PEND[path] = {obj: obj}; updateDirty(); }
function touchRaw(path, raw){ PEND[path] = {raw: raw}; updateDirty(); }
function updateDirty(){
  const d = Object.keys(PEND).length > 0;
  $("#vtitle").classList.toggle("dirty", d);
  $("#saveBtn").textContent = d ? ("💾 ذخیره (" + Object.keys(PEND).length + ")") : "💾 ذخیره";
}
async function saveAll(){
  const paths = Object.keys(PEND);
  if(!paths.length){ toast("چیزی برای ذخیره نیست"); return; }
  toast("در حال ذخیرهٔ " + paths.length + " فایل…");
  try{
    for(const p of paths){
      const rec = PEND[p];
      if(p === "units"){
        const r = await fetch("/admin/api/units", {method:"PUT", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({units: rec.obj})}).then(r => r.json());
        if(!r.ok) throw new Error("unit-course.js: " + (r.error || "خطای نامشخص"));
        continue;
      }
      const raw = rec.raw !== undefined ? rec.raw : JSON.stringify(rec.obj, null, 2);
      if(p.endsWith(".json")){
        try{ JSON.parse(raw); }catch(e){ throw new Error(p + ": JSON نامعتبر — " + e.message); }
      }
      const r = await fetch("/admin/api/file", {method:"PUT", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({path: p, raw: raw})}).then(r => r.json());
      if(!r.ok) throw new Error(p + ": " + (r.error || "خطای نامشخص"));
    }
    PEND = {}; updateDirty();
    toast("ذخیره شد ✓ — پشتیبان .admin.bak + نوشتن در کپی بیلد", "ok");
  }catch(e){
    toast("خطا در ذخیره: " + e.message, "err");
  }
}
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveAll(); }
});
window.addEventListener("beforeunload", e => {
  if(Object.keys(PEND).length){ e.preventDefault(); e.returnValue = ""; }
});

async function apiGet(p){ return fetch("/admin/api/" + p).then(r => r.json()); }

}

/* ---------- shared UI builders ---------- */
function fld(label, value, onchange, opts){
  opts = opts || {};
  const w = el("div", "fld");
  let ctl;
  if(opts.big){
    const ta = document.createElement("textarea");
    ta.value = value == null ? "" : value;
    if(opts.rows) ta.rows = opts.rows;
    if(opts.ltr) ta.classList.add("ltr");
    ta.oninput = () => onchange(ta.value);
    ctl = ta;
  } else if(opts.select){
    const s = document.createElement("select");
    (opts.options || []).forEach(o => {
      const op = document.createElement("option");
      op.value = o[0]; op.textContent = o[1];
      if(String(value) === String(o[0])) op.selected = true;
      s.appendChild(op);
    });
    s.onchange = () => onchange(s.value);
    ctl = s;
  } else if(opts.check){
    const c = document.createElement("input");
    c.type = "checkbox"; c.checked = !!value;
    c.style.width = "18px"; c.style.height = "18px"; c.style.accentColor = "#2bd19d";
    c.onchange = () => onchange(c.checked);
    ctl = c;
  } else {
    const i = document.createElement("input");
    i.type = opts.num ? "number" : "text";
    i.value = value == null ? "" : value;
    if(opts.ltr) i.classList.add("ltr");
    i.oninput = () => onchange(opts.num ? (isNaN(+i.value) ? i.value : +i.value) : i.value);
    ctl = i;
  }
  w.appendChild(ctl);
  const l = el("label", "", esc(label));
  if(opts.ltr) l.classList.add("ltr");
  w.insertBefore(l, w.firstChild);
  return w;
}
function ro(label, value){
  const w = el("div", "fld");
  w.appendChild(el("label", "", esc(label)));
  const i = document.createElement("input");
  i.type = "text"; i.readOnly = true; i.value = value == null ? "" : value;
  i.classList.add("ltr"); i.style.opacity = .65;
  w.appendChild(i);
  return w;
}
function backBtn(bar, txt, fn){
  const b = el("button", "btn gray sm", txt);
  b.onclick = fn;
  bar.appendChild(b);
}
function viewhead(title, sub){
  const h = el("div", "viewhead");
  const box = el("div");
  box.appendChild(el("h2", "", esc(title)));
  if(sub) box.appendChild(el("div", "sub", sub));
  h.appendChild(box);
  h.appendChild(el("div", "sp"));
  return h;
}
function pager(holder, items, renderOne, chunk){
  chunk = chunk || 50;
  let shown = 0;
  function more(){
    const slice = items.slice(shown, shown + chunk);
    slice.forEach((item, j) => renderOne(item, shown + j));
    shown += slice.length;
    if(shown >= items.length && lmBtn) lmBtn.remove();
  }
  const lmBtn = el("button", "loadmore", "نمایش بیشتر…");
  lmBtn.onclick = more;
  more();
  if(shown < items.length) holder.appendChild(lmBtn);
}

let CUR_VIEW = "";
function nav(id){ location.hash = "#/" + id; }
async function route(){
  const h = location.hash.replace(/^#\/?/, "") || "dashboard";
  const parts = h.split("/").map(s => decodeURIComponent(s));
  const name = parts[0];
  const p1 = parts[1] || "", p2 = parts[2] || "";
  // nav highlight
  document.querySelectorAll(".nitem").forEach(n => n.classList.toggle("on", n.dataset.id === name.split("?")[0]));
  $("#vtitleTxt").textContent = (NAV.find(n => n.id === name.split("?")[0]) || {}).label || "پنل ادمین";
  CUR_VIEW = name;
  body.innerHTML = '<div class="hint">در حال بارگذاری…</div>';
  PEND = {}; updateDirty();
  try{
    if(name === "dashboard") return await vDashboard();
    if(name === "users") return await vUsers(p1);
    if(name === "user_stats") return await vUserStats();
    if(name === "feedback") return await vFeedback();
    if(name === "drills") return await vDrills(p1);
    if(name === "pinyin") return await vPinyin();
    if(name === "reviews") return await vReviews();
    if(name === "appsettings") return await vAppSettings();
    if(name === "lessons") return await vLessons(p1, p2);
    if(name === "unit") return await vUnit(p1);
    if(name === "stories") return await vStories(p1);
    if(name === "podcasts") return await vPodcasts(p1);
    if(name === "clips") return await vClips();
    if(name === "library") return await vLibrary();
    if(name === "fa") return await vFA(p1);
    if(name === "wordlists") return await vWordlists(p1);
    if(name === "grammar") return await vGrammar(p1);
    if(name === "dict") return await vDict(p1, p2);
    if(name === "build") return await vBuild();
    if(name === "files") return await vFiles(p1);
    if(name === "search") return await vSearch(parts.slice(1).join("/"));
    return await vRaw(parts.slice(1).join("/"));
  }catch(e){
    body.innerHTML = "";
    body.appendChild(el("div", "hint", "خطا در بارگذاری: " + esc(e.message)));
  }
}
window.addEventListener("hashchange", route);

function getAdminToken(){ try{ return localStorage.getItem("chinifa_admin_token") || ""; }catch(e){ return ""; } }
function adminLogout(){ try{ localStorage.removeItem("chinifa_admin_token"); }catch(e){} location.reload(); }
function setDbBadge(connected, msg){
  const b = document.getElementById("dbStatusBadge");
  if(!b) return;
  b.className = "badge " + (connected ? "acc" : "dang");
  b.textContent = msg || (connected ? "🟢 دیتابیس متصل" : "🔴 دیتابیس متصل نیست");
}
(function initAdminAuthGate(){
  const gate = document.getElementById("admin-auth-gate");
  const form = document.getElementById("adminAuthForm");
  const errEl = document.getElementById("adminAuthErr");
  const tk = getAdminToken();
  if(tk){
    fetch("/api/admin?action=status", { headers: { "Authorization": "Bearer " + tk } })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if(ok && d && d.ok){
          gate.hidden = true;
          const dbErrMsg = d.dbConnected
            ? ("🟢 دیتابیس متصل (" + (d.userCount || 0) + " کاربر)")
            : (d.hasPostgresEnv
                ? ("🔴 خطای اتصال دیتابیس: " + (d.dbError || "بررسی کنید"))
                : "🔴 متغیر POSTGRES_URL روی این دیپلوی نیست (در Vercel یک Redeploy انجام دهید)");
          setDbBadge(!!d.dbConnected, dbErrMsg);
        } else {
          localStorage.removeItem("chinifa_admin_token");
          gate.hidden = false;
        }
      }).catch(() => { gate.hidden = false; });
  }
  if(form){
    form.addEventListener("submit", async function(e){
      e.preventDefault();
      errEl.hidden = true;
      const u = (document.getElementById("adminUserIn").value || "").trim();
      const p = document.getElementById("adminPassIn").value || "";
      try {
        const r = await fetch("/api/admin?action=login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        const d = await r.json().catch(() => ({}));
        if(!r.ok || !d.ok || !d.token){
          errEl.hidden = false;
          errEl.textContent = d.error || "نام کاربری یا رمز عبور اشتباه است.";
          return;
        }
        localStorage.setItem("chinifa_admin_token", d.token);
        gate.hidden = true;
        USERS_LIST = null;
        location.reload();
      } catch(err){
        errEl.hidden = false;
        errEl.textContent = "خطا در ارتباط با سرور.";
      }
    });
  }
})();

async function getUsersData(){
  if(USERS_LIST) return USERS_LIST;
  const tk = getAdminToken();
  if(tk){
    try {
      const r = await fetch("/api/admin?action=users", { headers: { "Authorization": "Bearer " + tk } });
      if(r.status === 401){ adminLogout(); return []; }
      const res = await r.json();
      if(res && res.ok){
        setDbBadge(!!res.dbConnected, res.dbConnected ? ("🟢 دیتابیس متصل (" + (res.users||[]).length + " کاربر)") : "🔴 دیتابیس متصل نیست");
        if(res.dbConnected){
          USERS_LIST = Array.isArray(res.users) ? res.users : [];
          return USERS_LIST;
        }
      }
    } catch(e){}
  }
  try {
    const res = await apiGet("users");
    if(res && res.users && res.users.length) { USERS_LIST = res.users; return USERS_LIST; }
  } catch(e){}
  USERS_LIST = [];
  return USERS_LIST;
}

async function adminApiCall(action, method, body){
  const tk = getAdminToken();
  const opts = {
    method: method || "GET",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tk }
  };
  if(body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch("/api/admin?action=" + encodeURIComponent(action), opts);
  if(r.status === 401){ adminLogout(); throw new Error("نشست ادمین منقضی شده است"); }
  const data = await r.json().catch(() => ({}));
  if(!r.ok || data.ok === false) throw new Error(data.error || "خطای سرور");
  return data;
}

async function syncUserToDb(u){
  return adminApiCall("user-update", "POST", {
    id: u.id,
    email: u.email,
    name: u.name,
    level: u.level,
    status: u.status,
    role: u.role || (u.status === "vip" ? "vip" : "user"),
    isPro: u.status === "vip" || u.role === "vip"
  });
}

async function deleteUserFromDb(u){
  return adminApiCall("user-delete", "POST", { id: u.id, email: u.email });
}

async function saveUsersData(list){
  USERS_LIST = list;
  localStorage.setItem("chinifa_admin_users", JSON.stringify(list));
}

async function saveFeedbackData(list){

async function getSettingsData(){
  if(APP_SETTINGS) return APP_SETTINGS;
  if(getAdminToken()){
    try {
      const res = await adminApiCall("settings-get", "GET");
      if(res && res.dbConnected && res.settings){ APP_SETTINGS = res.settings; return APP_SETTINGS; }
    } catch(e){}
  }
  try {
    const res = await apiGet("appsettings");
    if(res && res.settings && Object.keys(res.settings).length) { APP_SETTINGS = res.settings; return APP_SETTINGS; }
  } catch(e){}
  APP_SETTINGS = JSON.parse(JSON.stringify(SEED_SETTINGS));
  return APP_SETTINGS;
}

async function saveSettingsData(st){
  APP_SETTINGS = st;
  localStorage.setItem("chinifa_admin_settings", JSON.stringify(st));
  if(getAdminToken()){
    await adminApiCall("settings-save", "POST", { settings: st });
  }
}

function exportUsersCSV(users){
  const headers = ["شناسه", "نام", "نام کاربری", "شماره تماس", "ایمیل", "سطح HSK", "درس فعلی", "واژه‌ها", "استریک", "امتیاز XP", "وضعیت", "تاریخ ثبت‌نام"];
  const rows = users.map(u => [
    u.id, u.name, u.username, u.phone || "", u.email || "", u.level, u.currentLesson, u.wordsLearned, u.streak, u.xp, u.status, u.createdAt
  ]);
  const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(","))].join("\n");
  const blob = new Blob([csvContent], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "chinifa_users_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
  toast("خروجی اکسل/CSV کاربران دانلود شد", "ok");
}

  body.appendChild(head);

  const vipCount = users.filter(u => u.status === "vip").length;

  const avgStreak = Math.round(users.reduce((a,u) => a + (u.streak||0), 0) / (users.length || 1));

  const kpis = el("div", "cards");
  kpis.innerHTML = `
    <div class="stat"><div class="n">${users.length}</div><div class="l">کل زبان‌آموزان</div><div class="s">${activeCount} فعال</div></div>

    <div class="stat"><div class="n">🔥 ${avgStreak} روز</div><div class="l">میانگین استریک</div><div class="s">حفظ تداوم یادگیری</div></div>
    <div class="stat"><div class="n">⚡ ${(totalXP/1000).toFixed(1)}k</div><div class="l">کل امتیاز کسب‌شده</div><div class="s">تجربه یادگیری (XP)</div></div>
  `;
  body.appendChild(kpis);

  // Filter & Search bar
  let fq = "", flv = "", fst = "";
  const bar = el("div", "searchrow");
  const qi = document.createElement("input");
  qi.type = "text";
  qi.placeholder = "🔍 جستجو بر اساس نام، نام کاربری، شماره، ایمیل یا شناسه…";
  qi.oninput = () => { fq = qi.value.trim().toLowerCase(); draw(); };

  const lvSel = document.createElement("select");
  lvSel.innerHTML = '<option value="">همهٔ سطوح</option>' + [1,2,3,4,5,6].map(n => '<option value="HSK ' + n + '">HSK ' + n + '</option>').join("");
  lvSel.onchange = () => { flv = lvSel.value; draw(); };

  const stSel = document.createElement("select");
  stSel.innerHTML = '<option value="">همهٔ وضعیت‌ها</option><option value="active">فعال</option><option value="vip">عضو VIP</option><option value="suspended">مسدود شده</option>';
  stSel.onchange = () => { fst = stSel.value; draw(); };

  bar.append(qi, lvSel, stSel);
  body.appendChild(bar);

  const list = el("div");
  body.appendChild(list);

  function filtered(){
    return users.filter(u => {
      const matchQ = !fq || (u.name + " " + u.username + " " + (u.email||"") + " " + (u.phone||"") + " " + u.id).toLowerCase().includes(fq);
      const matchLv = !flv || u.level === flv;
      const matchSt = !fst || u.status === fst;
      return matchQ && matchLv && matchSt;
    });
  }

  function draw(){
    list.innerHTML = "";
    const items = filtered();
    if(!items.length){
      list.appendChild(el("div", "hint", "کاربری با فیلترهای مشخص‌شده یافت نشد."));

    items.forEach(u => {

      const initials = u.name.split(" ").slice(0,2).map(s => s[0]).join("") || "کاربر";
      const statusFa = u.status === "vip" ? "ویژه VIP" : (u.status === "suspended" ? "مسدود" : "فعال");
      const statusCls = u.status;
      const progressPercent = Math.min(100, Math.round(((u.currentLesson || 0) / 15) * 100));

      card.innerHTML = `
        <div class="user-avatar">${initials}</div>
        <div class="user-info">
          <div class="user-name">
            <span>${esc(u.name)}</span>
            <span class="badge ${statusCls}">${statusFa}</span>
            <span class="badge" style="background:var(--panel2);border-color:var(--line2)">${u.level}</span>
          </div>
          <div class="user-meta">
            <span>شناسه: <b class="ltr font-mono">${u.id}</b></span>
            <span>نام کاربری: <b class="ltr">@${u.username}</b></span>
            <span>تماس: <span class="ltr">${u.phone || '—'}</span></span>
            <span>آخرین فعالیت: ${u.lastActive || '—'}</span>

        </div>
        <div class="user-metrics">
          <div style="text-align:center">
            <div style="font-size:11px;color:var(--dim)">پیشرفت (درس ${u.currentLesson||0}/15)</div>
            <div class="prog-bar"><div class="prog-fill" style="width:${progressPercent}%"></div></div>
          </div>
          <span class="metric-pill streak" title="استریک یادگیری روزانه">🔥 ${u.streak || 0} روز</span>
          <span class="metric-pill xp" title="امتیاز کلی زبان‌آموز">⚡ ${u.xp || 0} XP</span>
        </div>
        <div class="user-actions">
          <button class="btn ghost sm btn-edit" title="ویرایش کامل">✏️</button>
          <button class="btn ghost sm btn-toggle-status" title="${u.status === 'suspended' ? 'رفع مسدودیت' : 'مسدود کردن'}">

          <button class="btn dangb sm btn-del" title="حذف کاربر">🗑️</button>

      card.querySelector(".btn-edit").onclick = (e) => { e.stopPropagation(); openUserModal(u); };

        e.stopPropagation();
        const prev = u.status;
        u.status = u.status === "suspended" ? "active" : "suspended";
        try {
          await syncUserToDb(u);
          await saveUsersData(users);
          toast(`وضعیت کاربر در دیتابیس به ${u.status === 'suspended' ? 'مسدود' : 'فعال'} تغییر یافت`, "ok");

        await syncUserToDb(u);
        if(isEdit){
          const idx = users.findIndex(x => x.id === u.id);
          if(idx !== -1) users[idx] = u;
        } else {
          users.unshift(u);
        }
        await saveUsersData(users);
        toast("اطلاعات و نقش کاربر در دیتابیس ذخیره شد", "ok");
        close();
        draw();
      } catch(err) {
        toast("خطا در ذخیره کاربر: " + err.message, "err");
      }
    };
  }
}

/* ============================================================

   ============================================================ */
async function vUserStats(){
  const users = await getUsersData();
  body.innerHTML = "";
  const head = viewhead("داشبورد آماری کاربران", "تحلیل روند یادگیری، پراکندگی سطوح HSK و تعامل کاربران");

  `;
  body.appendChild(statCards);

  // Distribution & Activity Charts
  const chartRow = el("div", "grid2");

  // Chart 1: HSK Level Distribution
  const distCounts = {
    'HSK 1': users.filter(u => u.level === 'HSK 1').length,
    'HSK 2': users.filter(u => u.level === 'HSK 2').length,
    'HSK 3': users.filter(u => u.level === 'HSK 3').length,
    'HSK 4': users.filter(u => u.level === 'HSK 4').length,
    'HSK 5': users.filter(u => u.level === 'HSK 5').length,
    'HSK 6': users.filter(u => u.level === 'HSK 6').length,
  };
  const maxDist = Math.max(...Object.values(distCounts), 1);

  const chart1 = el("div", "chart-box");
  chart1.innerHTML = `
    <div class="chart-title">📊 پراکندگی زبان‌آموزان در سطوح HSK</div>
    <div class="chart-bars">
      ${Object.entries(distCounts).map(([lvl, cnt]) => {
        const heightPct = Math.max(8, Math.round((cnt / maxDist) * 100));
        return `
          <div class="chart-col">
            <span class="val">${cnt} نفر</span>
            <div class="bar" style="height:${heightPct}%"></div>
            <span class="lbl">${lvl}</span>
          </div>
        `;
      }).join("")}
    </div>
  `;

  // Chart 2: Weekly Activity Trend
  const weekDays = [
    {day: 'شنبه', val: 18},
    {day: '۱شنبه', val: 24},
    {day: '۲شنبه', val: 29},
    {day: '۳شنبه', val: 26},
    {day: '۴شنبه', val: 32},
    {day: '۵شنبه', val: 41},
    {day: 'جمعه', val: 45}
  ];
  const maxWeek = Math.max(...weekDays.map(w => w.val));

  const chart2 = el("div", "chart-box");
  chart2.innerHTML = `
    <div class="chart-title">📈 روند یادگیری و تمرین هفتگی (جلسات روزانه)</div>
    <div class="chart-bars">
      ${weekDays.map(w => {
        const heightPct = Math.max(8, Math.round((w.val / maxWeek) * 100));
        return `
          <div class="chart-col">
            <span class="val">${w.val}</span>
            <div class="bar" style="height:${heightPct}%;background:linear-gradient(180deg,#38bdf8,#0369a1)"></div>
            <span class="lbl">${w.day}</span>
          </div>
        `;
      }).join("")}
    </div>
  `;

  chartRow.append(chart1, chart2);
  body.appendChild(chartRow);

  // Leaderboard of Top Learners
  const sortedUsers = [...users].sort((a,b) => (b.streak||0) - (a.streak||0)).slice(0, 5);
  const leadBox = el("div", "card");
  leadBox.innerHTML = `
    <h3 style="margin:0 0 14px;color:#fff;font-size:15px">🏆 برترین زبان‌آموزان با بالاترین تداوم (استریک)</h3>
    <div>
      ${sortedUsers.map((u, i) => {
        const medal = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : `#${i+1}`));
        return `
          <div class="rowitem" style="cursor:default">
            <span style="font-size:18px;width:30px;text-align:center">${medal}</span>
            <div class="main-txt">
              <div class="t1">${esc(u.name)} <span class="badge" style="background:var(--panel2)">${u.level}</span></div>

              <span class="metric-pill streak">🔥 ${u.streak} روز</span>
              <span class="metric-pill xp">⚡ ${u.xp} XP</span>
            </div>
          </div>
        `;
      }).join("")}

  body.appendChild(leadBox);

/* ============================================================
   VIEW: USER FEEDBACK & SUPPORT (vFeedback)
   ============================================================ */
async function vFeedback(){
  const feedback = await getFeedbackData();
  body.innerHTML = "";
  const head = viewhead("پیام‌ها و بازخوردها", feedback.length + " نظر و پیام ثبت‌شده توسط کاربران اپلیکیشن");

  const addFbBtn = el("button", "btn", "+ ثبت بازخورد دستی");
  addFbBtn.onclick = () => openFeedbackModal();
  head.append(addFbBtn);
  body.appendChild(head);

  const list = el("div");
  body.appendChild(list);

  function draw(){
    list.innerHTML = "";
    if(!feedback.length){
      list.appendChild(el("div", "hint", "هنوز بازخوردی ثبت نشده است."));
      return;
    }

    feedback.forEach(item => {
      const card = el("div", "card");
      const stars = "★".repeat(item.rating || 5) + "☆".repeat(5 - (item.rating || 5));
      const statusCls = item.status === "حل شد" ? "resolved" : (item.status === "در انتظار پاسخ" ? "pending" : "active");

      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="badge ${statusCls}">${item.status}</span>
              <span class="badge" style="background:var(--panel2)">${item.type}</span>
              <b style="color:#fff;font-size:14px">${esc(item.subject)}</b>
            </div>
            <div style="font-size:12px;color:var(--dim);margin-top:4px">
              ارسال‌شده توسط: <b>${esc(item.userName)}</b> (${item.userId}) · تاریخ: ${item.date} · امتیاز: <span style="color:#f5b95f">${stars}</span>
            </div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn ghost sm btn-status" title="تغییر وضعیت">تغییر وضعیت ▾</button>
            <button class="btn ghost sm btn-reply" title="پاسخ ادمین">✍️ پاسخ</button>
            <button class="btn dangb sm btn-del-fb" title="حذف">🗑️</button>
          </div>
        </div>
        <div style="background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:var(--txt);font-size:13px;line-height:1.6;margin-top:8px">
          ${esc(item.content)}
        </div>
        ${item.reply ? `
          <div style="background:var(--acc-soft);border:1px solid rgba(43,209,157,0.3);border-radius:9px;padding:8px 12px;color:var(--acc);font-size:12.5px;margin-top:8px">
            <b>پاسخ پشتیبانی chinifa:</b> ${esc(item.reply)}
          </div>
        ` : ''}
      `;

      card.querySelector(".btn-status").onclick = async () => {
        const statuses = ["در انتظار پاسخ", "در حال بررسی", "حل شد"];
        const curIdx = statuses.indexOf(item.status);
        item.status = statuses[(curIdx + 1) % statuses.length];
        await saveFeedbackData(feedback);
        toast(`وضعیت بازخورد به «${item.status}» تغییر یافت`, "ok");
        draw();
      };

      card.querySelector(".btn-reply").onclick = () => {
        const rep = prompt("متن پاسخ به کاربر را وارد کنید:", item.reply || "");
        if(rep !== null){
          item.reply = rep.trim();
          if(item.reply) item.status = "حل شد";
          saveFeedbackData(feedback);
          toast("پاسخ شما با موفقیت ثبت شد", "ok");
          draw();
        }
      };

      card.querySelector(".btn-del-fb").onclick = async () => {
        if(confirm("آیا مایل به حذف این بازخورد هستید؟")){
          const idx = feedback.findIndex(x => x.id === item.id);
          if(idx !== -1) feedback.splice(idx, 1);
          await saveFeedbackData(feedback);
          toast("بازخورد حذف شد", "ok");
          draw();
        }
      };

      list.appendChild(card);
    });
  }

  draw();

  function openFeedbackModal(){
    const subject = prompt("موضوع بازخورد / نظر:");
    if(!subject) return;
    const content = prompt("متن بازخورد:");
    if(!content) return;

    const newItem = {
      id: "FB-" + (100 + feedback.length + 1),
      userId: "USR-MANUAL",
      userName: "ثبت مستقیم ادمین",
      type: "پیشنهاد",
      subject: subject.trim(),
      content: content.trim(),
      rating: 5,
      date: new Date().toLocaleDateString("fa-IR"),
      status: "در حال بررسی",
      reply: ""
    };
    feedback.unshift(newItem);
    saveFeedbackData(feedback);
    toast("بازخورد جدید با موفقیت اضافه شد", "ok");
    draw();
  }
}

/* ============================================================
   VIEW: PERIODIC DRILLS (vDrills)
   ============================================================ */
async function vDrills(file){
  body.innerHTML = "";
  const files = ["hsk1.json", "hsk2.json", "hsk3.json", "hsk4.json"];
  if(!file){
    const head = viewhead("تمرین‌های دوره‌ای (Drills)", "فایل‌های تمرین تثبیت مهارت HSK 1 تا HSK 4 در content/drills/");
    body.appendChild(head);
    const list = el("div");
    body.appendChild(list);

    for(const f of files){
      const path = "content/drills/" + f;
      const r = await apiFile(path);
      const lessonCount = (r.parsed && r.parsed.lessons) ? Object.keys(r.parsed.lessons).length : "?";
      const d = el("div", "rowitem");
      d.innerHTML = `
        <div class="main-txt">
          <div class="t1 ltr">${esc(f)}</div>
          <div class="t2">${lessonCount} درس تمرین · ${fmtSize(r.size)}</div>
        </div>
      `;
      d.onclick = () => nav("drills/" + f);
      list.appendChild(d);
    }
    return;
  }

  const path = "content/drills/" + file;
  const r = await apiFile(path);
  const head = viewhead(file, "ویرایشگر تمرین‌های دوره‌ای: " + path);
  backBtn(head, "→ لیست تمرین‌ها", () => nav("drills"));
  body.appendChild(head);

  if(!r.parsed){
    nav("raw/" + path);
    return;
  }

  const lessonsObj = r.parsed.lessons || {};
  const lessonKeys = Object.keys(lessonsObj);
  const info = el("div", "hint", `شامل ${lessonKeys.length} درس تمرین تثبیت دوره‌ای. برای ویرایش مستقیم هر درس یا ساختار JSON از دکمه‌های زیر استفاده کنید:`);
  body.appendChild(info);

  const actions = el("div", "top", "");
  const editRawBtn = el("button", "btn ghost", "📝 ویرایش کد خام JSON");
  editRawBtn.onclick = () => nav("raw/" + path);
  actions.appendChild(editRawBtn);
  body.appendChild(actions);

  const container = el("div");
  body.appendChild(container);

  lessonKeys.slice(0, 15).forEach(lk => {
    const lData = lessonsObj[lk];
    const qCount = Array.isArray(lData) ? lData.length : (lData.items ? lData.items.length : (typeof lData === 'object' ? Object.keys(lData).length : 0));
    const card = el("div", "card");
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <b style="color:#fff;font-size:14px">درس تمرین: ${esc(lk)}</b>
          <div style="font-size:12px;color:var(--dim);margin-top:3px">${qCount} آیتم / سؤال تمرین</div>
        </div>
        <button class="btn sm ghost" onclick="nav('raw/${path}')">ویرایش ✏️</button>
      </div>
    `;
    container.appendChild(card);
  });
}

  const head = viewhead("دیدگاه‌های کاربران (Pay Reviews)", "دیدگاه‌ها و نظرات ثبت‌شده در اپلیکیشن (content/pay-reviews.json)");

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div>
            <b style="color:#fff;font-size:14px">${esc(rev.name || rev.user || 'کاربر chinifa')}</b>

      `;
      card.querySelector(".btn-del-rev").onclick = async () => {
        if(confirm("آیا از حذف این دیدگاه مطمئن هستید؟")){
          data.reviews.splice(idx, 1);
          data.count = data.reviews.length;
          await apiPut("content/pay-reviews.json", JSON.stringify(data, null, 2));
          toast("دیدگاه با موفقیت حذف شد", "ok");
          draw();
        }
      };
      container.appendChild(card);
    });
  }

  draw();

  addBtn.onclick = async () => {

    data.count = data.reviews.length;
    await apiPut("content/pay-reviews.json", JSON.stringify(data, null, 2));
    toast("نظر جدید به pay-reviews.json اضافه شد", "ok");
    draw();
  };
  head.appendChild(addBtn);
}

async function vLessonDetail(course, l){
  if(!l){ body.innerHTML = '<div class="hint">درس پیدا نشد.</div>'; return; }
  await loadFA();
  body.innerHTML = "";
  const head = viewhead("درس " + l.no + " — " + (l.title || ""), (LES_OBJ.name || course) + " · " + (l.titleZh || ""));
  backBtn(head, "→ فهرست درس‌ها", () => nav("lessons/" + course));
  if(course === "hsk1"){

  }

  const f = el("div", "card");

  g2.append(
    fld("عنوان انگلیسی", l.title, v => { l.title = v; touch(LES_PATH, LES_OBJ); }, {ltr: true}),
    fld("عنوان چینی", l.titleZh, v => { l.titleZh = v; touch(LES_PATH, LES_OBJ); }, {ltr: true}),
    fld("عنوان فارسی", l.titleFa, v => { l.titleFa = v; touch(LES_PATH, LES_OBJ); }),
    fld("هدف فارسی (goalFa)", l.goalFa, v => { l.goalFa = v; touch(LES_PATH, LES_OBJ); })
  );
  f.appendChild(g2);
  const g3 = el("div", "grid3");
  g3.append(
    fld("هدف انگلیسی (goal)", l.goal, v => { l.goal = v; touch(LES_PATH, LES_OBJ); }, {ltr: true}),
    fld("تمرکز (focus، چینی)", l.focus, v => { l.focus = v; touch(LES_PATH, LES_OBJ); }, {ltr: true}),
    fld("صحنه (scene)", l.scene, v => { l.scene = v; touch(LES_PATH, LES_OBJ); }, {ltr: true})
  );
  f.appendChild(g3);
  f.appendChild(fld("خط داستانی (beat)", l.beat, v => { l.beat = v; touch(LES_PATH, LES_OBJ); }, {big: true, rows: 2, ltr: true}));
  const recArr = Array.isArray(l.recycle) ? l.recycle : [];
  f.appendChild(fld("بازآموزی (recycle — با ویرگول جدا کن)", recArr.join("، "), v => {
    l.recycle = v.split(/[،,]/).map(s => s.trim()).filter(Boolean);
    touch(LES_PATH, LES_OBJ);
  }, {ltr: true}));
  body.appendChild(f);

  // words
  const wc = el("div", "card");
  wc.appendChild(el("div", "grp", "واژه‌ها — " + (l.words || []).length + " مورد (معنی فارسی در fa.json ذخیره می‌شود)"));
  const addW = el("button", "add", "＋ افزودن واژه");
  addW.onclick = () => {
    l.words = l.words || [];
    l.words.push({ch: "", py: "", en: "", type: "词汇"});
    touch(LES_PATH, LES_OBJ);
    drawLessonWords(l);
  };
  wc.appendChild(addW);
  const listw = el("div");
  wc.appendChild(listw);
  wc._draw = () => drawLessonWords(l, listw);
  body.appendChild(wc);
  drawLessonWords(l, listw);

  function drawLessonWords(l, listw){
    listw.innerHTML = "";
    (l.words || []).forEach((w, i) => {
      const rw = el("div", "wordrow");
      const oldCh = w.ch;
      const mk = (val, cb, cls) => {
        const i = document.createElement("input");
        i.type = "text"; i.value = val == null ? "" : val;
        if(cls) i.classList.add(cls);
        i.oninput = () => cb(i.value);
        return i;
      };
      rw.appendChild(mk(w.ch, v => {
        // migrate fa key
        if(oldCh && FA && FA.m && FA.m[oldCh] !== undefined && v && v !== oldCh){
          FA.m[v] = FA.m[oldCh]; delete FA.m[oldCh]; touch(FA_PATH, FA);
        }
        w.ch = v; touch(LES_PATH, LES_OBJ);
      }, "zh"));
      rw.appendChild(mk(w.py, v => { w.py = v; touch(LES_PATH, LES_OBJ); }, "ltr"));
      rw.appendChild(mk(w.en, v => { w.en = v; touch(LES_PATH, LES_OBJ); }, "ltr"));
      rw.appendChild(mk(w.type, v => { w.type = v; touch(LES_PATH, LES_OBJ); }, "ltr"));
      rw.appendChild(mk(faM(w.ch), v => { setFaM(w.ch, v); }, ""));
      const del = el("button", "del", "🗑");
      del.onclick = () => { l.words.splice(i, 1); touch(LES_PATH, LES_OBJ); drawLessonWords(l, listw); };
      rw.appendChild(del);
      listw.appendChild(rw);
    });
  }
}

  body.appendChild(meta);

  // sections
  (u.sections || []).forEach(sec => body.appendChild(secCard(sec)));

  function secCard(sec){
    const det = el("details", "sec");

    det.appendChild(el("summary", "", "<span>" + esc(SEC_FA[sec.id] || sec.title || sec.id) + "</span><span class='badge'>" + nEx + " تمرین</span><span class='badge'>ایستگاه " + esc(sec.num != null ? sec.num : "") + "</span>"));

      delMl.onclick = () => { if(confirm("ایستگاه «" + (ml.title || "") + "» با همهٔ تمرین‌هایش حذف شود؟")){ sec.miniLessons.splice(mi, 1); TU(); drawMl(); } };
      ctl.append(up, dn, delMl);

      // exercises

        const t = sel.value;
        ml.exercises = ml.exercises || [];

        TU(); drawEx();
      };
      addBar.append(sel, addEx);
      bd2.appendChild(addBar);
      function drawEx(){ exBox.innerHTML = ""; (ml.exercises || []).forEach((ex, ei) => exBox.appendChild(exCard(ex, ei))); }
      function moveEx(ei, d){
        const arr = ml.exercises;
        const j = ei + d;
        if(j < 0 || j >= arr.length) return;
        [arr[ei], arr[j]] = [arr[j], arr[ei]];
        TU(); drawEx();
      }
      function exCard(ex, ei){
        const card = el("div", "excard");
        const hd = el("div", "exhead");
        hd.appendChild(el("span", "badge acc", esc(EX_LABEL[ex.type] || ex.type || "?")));
        hd.appendChild(el("span", "badge", "#" + (ei + 1)));
        const up = el("button", "btn gray sm", "↑"); up.onclick = () => moveEx(ei, -1);
        const dn = el("button", "btn gray sm", "↓"); dn.onclick = () => moveEx(ei, 1);
        const del = el("button", "del", "🗑");
        del.onclick = () => { if(confirm("این تمرین حذف شود؟")){ ml.exercises.splice(ei, 1); TU(); drawEx(); } };
        hd.append(up, dn, del);
        card.appendChild(hd);
        renderEx(ex, card);
        return card;
      }
      drawEx();
      return det2;
    }
    drawMl();
    return det;
  }

  function renderIntro(intro, box){

    );

    Object.keys(intro).forEach(k => {

        function drawRows(){
          list.innerHTML = "";
          v.forEach((item, i) => {
            const fs = el("fieldset");
            const lg = el("legend", "", esc(k) + " " + (i + 1));
            fs.appendChild(lg);

            Object.keys(item).forEach(ik => {
              const iv = item[ik];

              g.appendChild(f);
            });
            fs.appendChild(g);
            const del = el("button", "del", "🗑 حذف این مورد");
            del.onclick = () => { v.splice(i, 1); TU(); drawRows(); };
            fs.appendChild(del);

          });

          v.push(nu);
          TU(); drawRows();
        };
        c.appendChild(add);
      } else if(Array.isArray(v)){
        const h = el("div", "grp", (KLAB[k] || k) + " — " + v.length + " خط");
        h.style.margin = "10px 0 4px";
        c.appendChild(h);
        const list = el("div");

        function drawStr(){

            list.appendChild(rw);
          });

        c.appendChild(fld(KLAB[k] || k, v, nv => { intro[k] = nv; TU(); }));

  function optRows(ex, box, keyName){
    const opts = ex[keyName] || [];
    const list = el("div");
    box.appendChild(list);
    const gname = "ans_" + (++RADIO_SEQ);
    function draw(){
      list.innerHTML = "";
      opts.forEach((o, i) => {
        const rw = el("div", "optr");
        const rb = document.createElement("input");
        rb.type = "radio"; rb.name = gname; rb.checked = ex.ans === i;
        rb.title = "گزینهٔ درست";
        rb.onchange = () => { if(rb.checked){ ex.ans = i; TU(); } };
        const inp = document.createElement("input");
        inp.type = "text"; inp.value = o == null ? "" : o;
        inp.placeholder = "گزینهٔ " + (i + 1);
        inp.oninput = () => { opts[i] = inp.value; TU(); };
        const del = el("button", "del", "🗑");
        del.onclick = () => { opts.splice(i, 1); if(ex.ans >= opts.length) ex.ans = 0; TU(); draw(); };
        rw.append(rb, inp, del);
        list.appendChild(rw);
      });
      const add = el("button", "add", "＋ گزینه");
      add.onclick = () => { opts.push(""); TU(); draw(); };
      list.appendChild(add);

    draw();

  function renderEx(ex, card){
    const t = ex.type;
    if(t === "choice" || t === "audio_choice" || t === "tone_pick"){
      card.appendChild(fld(t === "choice" ? "صورت سؤال" : "صورت سؤال", ex.q, v => { ex.q = v; TU(); }, {big: true, rows: 2}));
      if(ex.hanzi !== undefined) card.appendChild(fld("نویسهٔ چینی (نمایش + صوت)", ex.hanzi, v => { ex.hanzi = v; TU(); }, {ltr: true}));
      if(ex.pinyin !== undefined) card.appendChild(fld("پین‌یین", ex.pinyin, v => { ex.pinyin = v; TU(); }, {ltr: true}));
      if(ex.audio !== undefined) card.appendChild(fld("صوت (متن پین‌یینی که خوانده می‌شود)", ex.audio, v => { ex.audio = v; TU(); }, {ltr: true}));
      optRows(ex, card, "opts");
    } else if(t === "listening_q"){
      card.appendChild(fld("صورت سؤال", ex.prompt, v => { ex.prompt = v; TU(); }, {big: true, rows: 2}));
      card.appendChild(fld("صوت (متن پین‌یینی)", ex.audio, v => { ex.audio = v; TU(); }, {ltr: true}));
      optRows(ex, card, "opts");
      const g2 = el("div", "grid2");
      g2.append(
        fld("پاسخ چینی (بعد از جواب نشان داده می‌شود)", ex.revealZh, v => { ex.revealZh = v; TU(); }, {ltr: true}),
        fld("پین‌یین پاسخ", ex.revealPy, v => { ex.revealPy = v; TU(); }, {ltr: true})
      );
      card.appendChild(g2);
    } else if(t === "reading_q"){
      card.appendChild(fld("صورت سؤال", ex.q, v => { ex.q = v; TU(); }, {big: true, rows: 2}));
      const g3 = el("div", "grid3");
      g3.append(
        fld("متن چینی", ex.textZh, v => { ex.textZh = v; TU(); }, {ltr: true}),
        fld("پین‌یین متن", ex.textPy, v => { ex.textPy = v; TU(); }, {ltr: true}),
        fld("ترجمهٔ فارسی متن", ex.textFa, v => { ex.textFa = v; TU(); })
      );
      card.appendChild(g3);
      optRows(ex, card, "opts");
    } else if(t === "order"){
      card.appendChild(fld("صورت سؤال", ex.prompt, v => { ex.prompt = v; TU(); }, {big: true, rows: 2}));
      const h = el("div", "grp", "کلمه‌ها (به ترتیب نمایش — با ↑↓ فقط از طریق حذف/افزودن جابه‌جا می‌شود)");
      h.style.margin = "8px 0 4px";
      card.appendChild(h);
      strRows(ex.tiles = ex.tiles || [], card, "کلمه");
      card.appendChild(fld("جملهٔ صحیح (هدف)", ex.target, v => { ex.target = v; TU(); }, {ltr: true}));
    } else if(t === "match"){
      card.appendChild(fld("عنوان", ex.title, v => { ex.title = v; TU(); }));
      const h = el("div", "grp", "جفت‌ها (چینی ↔ فارسی)");
      h.style.margin = "8px 0 4px";
      card.appendChild(h);
      const list = el("div");
      card.appendChild(list);
      ex.pairs = ex.pairs || [];
      function draw(){
        list.innerHTML = "";
        ex.pairs.forEach((p, i) => {
          const rw = el("div", "wordrow");
          const iz = document.createElement("input"); iz.type = "text"; iz.value = p.zh || ""; iz.classList.add("zh"); iz.oninput = () => { p.zh = iz.value; TU(); };
          const sp = el("div");
          const ifa = document.createElement("input"); ifa.type = "text"; ifa.value = p.fa || ""; ifa.oninput = () => { p.fa = ifa.value; TU(); };
          const del = el("button", "del", "🗑");
          del.onclick = () => { ex.pairs.splice(i, 1); TU(); draw(); };
          rw.append(iz, sp, sp, sp, ifa, del);
          list.appendChild(rw);
        });
        const add = el("button", "add", "＋ جفت");
        add.onclick = () => { ex.pairs.push({zh: "", fa: ""}); TU(); draw(); };
        list.appendChild(add);
      }
      draw();
    } else if(t === "write"){
      const g2 = el("div", "grid2");
      g2.append(
        fld("نویسه (نوشتن با استروک)", ex.char, v => { ex.char = v; TU(); }, {ltr: true}),
        fld("پین‌یین", ex.py, v => { ex.py = v; TU(); }, {ltr: true})
      );
      card.appendChild(g2);
      card.appendChild(fld("معنی فارسی", ex.fa, v => { ex.fa = v; TU(); }));
      card.appendChild(fld("نکته (نشان داده می‌شود)", ex.tip, v => { ex.tip = v; TU(); }, {big: true, rows: 2}));
    } else if(t === "repeat"){
      card.appendChild(fld("جملهٔ هدف (چینی)", ex.target, v => { ex.target = v; TU(); }, {ltr: true}));
      const g2 = el("div", "grid2");
      g2.append(
        fld("پین‌یین", ex.py, v => { ex.py = v; TU(); }, {ltr: true}),
        fld("معنی فارسی", ex.fa, v => { ex.fa = v; TU(); })
      );
      card.appendChild(g2);
      card.appendChild(fld("نکته", ex.tip, v => { ex.tip = v; TU(); }, {big: true, rows: 2}));
    } else {
      // unknown type — raw JSON fallback
      const w = el("div", "fld");
      w.appendChild(el("label", "", "تمرین با نوع ناشناخته («" + esc(t) + "») — ویرایش JSON"));
      const ta = document.createElement("textarea");
      ta.classList.add("ltr");
      ta.style.minHeight = "120px";
      ta.value = JSON.stringify(ex, null, 2);
      ta.oninput = () => {
        try{
          const nu = JSON.parse(ta.value);
          Object.keys(ex).forEach(k => delete ex[k]);
          Object.assign(ex, nu);
          TU();
          ta.style.borderColor = "";
        }catch(e){ ta.style.borderColor = "var(--danger)"; }
      };
      w.appendChild(ta);
      card.appendChild(w);
    }
  }
}

async function vClips(){
  const r = await apiFile("content/feed.json");
  const OBJ = r.parsed;
  const T = () => touch("content/feed.json", OBJ);
  body.innerHTML = "";
  const head = viewhead("کلیپ‌های ویدیویی", OBJ.items.length + " کلیپ — ترجمهٔ فارسی هر خط و توضیح صحنه اینجا ویرایش می‌شود");
  const add = el("button", "btn", "＋ کلیپ جدید");
  add.onclick = () => {
    const id = prompt("شناسهٔ کلیپ جدید (انگلیسی، مثل myclip01):");
    if(!id) return;
    OBJ.items.unshift({id: id.toLowerCase(), at: new Date().toISOString(), channel: "daily", tag: "30 sec",
      durationSec: 30, level: "HSK 1", title: "", situation: "", videoUrl: "", poster: "", lines: []});
    T();
    draw();
  };
  head.appendChild(add);
  body.appendChild(head);

  let fq = "", fch = "", flv = "";
  const bar = el("div", "searchrow");
  const qi = document.createElement("input"); qi.type = "text"; qi.placeholder = "جستجو در عنوان/متن…";
  qi.oninput = () => { fq = qi.value.trim().toLowerCase(); draw(); };
  const chSel = document.createElement("select");
  chSel.innerHTML = '<option value="">همهٔ کانال‌ها</option>' +
    [...new Set(OBJ.items.map(c => c.channel).filter(Boolean))].map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join("");
  chSel.onchange = () => { fch = chSel.value; draw(); };
  const lvSel = document.createElement("select");
  lvSel.innerHTML = '<option value="">همهٔ سطوح</option>' +
    [...new Set(OBJ.items.map(c => c.level).filter(Boolean))].map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join("");
  lvSel.onchange = () => { flv = lvSel.value; draw(); };
  bar.append(qi, chSel, lvSel);
  body.appendChild(bar);
  const grid = el("div");
  body.appendChild(grid);

  function filtered(){
    return OBJ.items.filter(c =>
      (!fch || c.channel === fch) && (!flv || c.level === flv) &&
      (!fq || JSON.stringify([c.title, c.situation, c.id]).toLowerCase().includes(fq)));
  }
  function draw(){
    grid.innerHTML = "";
    const items = filtered();
    if(!items.length){ grid.appendChild(el("div", "empty", "کلیپی مطابق فیلتر نیست")); return; }
    items.forEach(c => grid.appendChild(clipCard(c)));
  }
  function clipCard(c){
    const card = el("div", "card");
    const head = el("div", "toolbar");
    const img = el("img", "thumb");
    img.src = mediaURL(c.poster || c.posterLQ || "");
    img.onerror = () => img.style.visibility = "hidden";
    const ttl = el("div", "main-txt");
    ttl.innerHTML = '<div class="t1 zh">' + esc(c.title || c.id) + '</div><div class="t2 ltr">' + esc(c.id) + " · " + esc(c.channel || "") + " · " + esc(c.tag || "") + " · " + c.durationSec + 's</div>';
    const del = el("button", "del", "🗑 حذف");
    del.onclick = () => { if(confirm("کلیپ «" + (c.title || c.id) + "» حذف شود؟")){
      OBJ.items.splice(OBJ.items.indexOf(c), 1); T(); draw(); } };
    head.append(img, ttl, del);
    card.appendChild(head);
    const g2 = el("div", "grid2");
    g2.append(
      fld("عنوان چینی", c.title, v => { c.title = v; ttl.querySelector(".t1").textContent = v || c.id; T(); }),
      fld("سطح", c.level, v => { c.level = v; T(); }),
      fld("کانال", c.channel, v => { c.channel = v; T(); }),
      fld("برچسب", c.tag, v => { c.tag = v; T(); }),
      fld("طول (ثانیه)", c.durationSec, v => { c.durationSec = +v || 0; T(); }, {num: true}),
      fld("آدرس ویدیو (mp4)", c.videoUrl, v => { c.videoUrl = v; T(); }, {ltr: true}),
      fld("آدرس پوستر", c.poster, v => { c.poster = v; T(); }, {ltr: true}),
      ro("لینک پیش‌نمایش", mediaURL(c.videoUrl))
    );
    card.appendChild(g2);
    card.appendChild(fld("توضیح فارسی صحنه", c.situation, v => { c.situation = v; T(); }, {big: true, rows: 3}));
    // lines
    const lines = c.lines || [];
    if(lines.length){
      const h = el("div", "grp", "خط‌ها — " + lines.length + " (فارسیِ هر خط در همین فایل ذخیره می‌شود)");
      h.style.margin = "10px 0 6px";
      card.appendChild(h);
      lines.forEach((ln, i) => {
        const fs = el("fieldset");
        const keyZh = ln.key || (ln.tokens && ln.tokens[0] && ln.tokens[0][0]) || "";
        fs.appendChild(el("legend", "", "خط " + (i + 1) + " · " + esc(keyZh) + " (" + (ln.start != null ? ln.start : "?") + "–" + (ln.end != null ? ln.end : "?") + "s)"));
        const g3 = el("div", "grid3");
        g3.append(
          fld("پین‌یین", ln.py, v => { ln.py = v; T(); }, {ltr: true}),
          fld("انگلیسی", ln.en, v => { ln.en = v; T(); }, {ltr: true}),
          fld("🇮🇷 فارسی", ln.fa, v => { ln.fa = v; T(); })
        );
        fs.appendChild(g3);
        card.appendChild(fs);
      });
    }
    return card;
  }
  draw();
}

  }
  draw();

   FA.JSON BROWSER
   ============================================================ */
async function vFA(tab){
  await loadFA();
  tab = tab || "m";
  body.innerHTML = "";
  const labels = {m: "معنی واژه‌ها", s: "جمله‌ها (کلیپ‌ها)", n: "اسم‌ها", g: "گرامر", gp: "تمرین گرامر", pat: "الگوها"};
  const head = viewhead("معنی‌های فارسی — fa.json", "مرجع مرکزی ترجمهٔ فارسی واژه‌ها و جمله‌ها");
  body.appendChild(head);
  const chips = el("div", "chips");
  Object.keys(labels).forEach(k => {
    if(!FA[k]) return;
    const ch = el("button", "chip" + (k === tab ? " on" : ""), esc(labels[k] + " · " + Object.keys(FA[k]).length));
    ch.onclick = () => nav("fa/" + k);
    chips.appendChild(ch);
  });
  body.appendChild(chips);
  const bar = el("div", "searchrow");
  const qi = document.createElement("input"); qi.type = "text"; qi.placeholder = "جستجوی کلید (چینی) یا مقدار (فارسی)…";
  bar.appendChild(qi);
  const addK = el("button", "add", "＋ کلید جدید");
  bar.appendChild(addK);
  body.appendChild(bar);
  const list = el("div");
  body.appendChild(list);
  let shown = 0, results = [];

  function draw(reset){
    if(reset){ shown = 0; list.innerHTML = ""; }
    const q = qi.value.trim().toLowerCase();
    const src = FA[tab] || {};
    results = Object.keys(src).filter(k =>
      !q || k.toLowerCase().includes(q) || String(src[k]).toLowerCase().includes(q));
    const slice = results.slice(shown, shown + 40);
    slice.forEach(k => {
      const v = src[k];
      if(tab === "g" && typeof v === "object"){
        // grammar entry: nested editor
        const fs = el("fieldset");
        fs.appendChild(el("legend", "zh", esc(k)));
        ["title","oneLine","explain","mistake"].forEach(fk => {
          fs.appendChild(fld(fk, v[fk], nv => { v[fk] = nv; touch(FA_PATH, FA); }, {big: fk === "explain", rows: 2}));
        });
        list.appendChild(fs);
        return;
      }
      const rw = el("div", "farow");
      const kIn = document.createElement("input"); kIn.type = "text"; kIn.readOnly = true; kIn.value = k; kIn.classList.add("zh");
      const vIn = document.createElement("input"); vIn.type = "text"; vIn.value = v == null ? "" : v;
      vIn.oninput = () => { src[k] = vIn.value; touch(FA_PATH, FA); };
      const del = el("button", "del", "🗑");
      del.onclick = () => { delete src[k]; touch(FA_PATH, FA); draw(true); };
      rw.append(kIn, vIn, del);
      list.appendChild(rw);
    });
    shown += slice.length;
    let lm = list.querySelector(".loadmore");
    if(shown < results.length){
      if(!lm){ lm = el("button", "loadmore", "نمایش بیشتر…"); lm.onclick = () => draw(false); list.appendChild(lm); }
    } else if(lm) lm.remove();
    if(!results.length && reset) list.appendChild(el("div", "empty", "چیزی پیدا نشد"));
  }
  qi.oninput = () => draw(true);
  addK.onclick = () => {
    const k = prompt("کلید جدید (چینی):");
    if(!k) return;
    if(FA[tab][k] !== undefined){ toast("این کلید از قبل هست", "err"); return; }
    FA[tab][k] = "";
    touch(FA_PATH, FA);
    draw(true);
  };
  draw(true);
}

let taskTimers = {};
function taskPanel(name, title, desc, runLabel){
  const box = el("div", "taskbox");

  h.innerHTML = '<div class="main-txt"><div class="t1">' + esc(title) + '</div><div class="t2">' + esc(desc) + '</div></div>';

  log.style.display = "none";
  box.appendChild(log);
  run.onclick = () => startTask(name);
  return {box, run, st, log};
}
async function startTask(name){
  if(taskTimers[name]) return;
  const ok = confirm(name === "build" ?
    "APK ساخته شود؟ (تغییرهای ذخیره‌شده در خروجی می‌آید)" :
    "تمرین‌های درس‌ها بازتولید شود؟ (gen_units → splice → کپی به بیلد)");
  if(!ok) return;
  await fetch("/admin/api/run", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({task: name})}).then(r => r.json());
  toast(name === "build" ? "ساخت APK آغاز شد…" : "بازسازی تمرین‌ها آغاز شد…");
  pollTask(name);
}
function pollTask(name){
  clearInterval(taskTimers[name]);
  async function tick(){
    let st;
    try{ st = await apiGet("task_status?task=" + name + "&_t=" + Date.now()); }
    catch(e){ return; }
    const p = taskPanels[name];
    if(!p) return;
    if(st.running){
      p.st.className = "badge warn";
      p.st.textContent = "در حال اجرا… " + Math.round((st.elapsed || 0) / 1000) + "s";
      p.log.style.display = "";
      p.log.textContent = (st.log_tail || []).join("\n");
      p.log.scrollTop = p.log.scrollHeight;
    } else {
      clearInterval(taskTimers[name]); taskTimers[name] = null;
      if(st.done){
        p.st.className = st.ok ? "badge acc" : "badge dang";
        p.st.textContent = st.ok ? "✓ موفق" : "✗ ناموفق";
        p.log.style.display = "";
        p.log.textContent = (st.log_tail || []).join("\n");
        p.log.scrollTop = p.log.scrollHeight;
        if(st.ok) toast(name === "build" ? "APK ساخته شد ✓ — Chinify.apk" : "تمرین‌ها بازسازی شد ✓", "ok");
        else toast(name === "build" ? "ساخت APK ناموفق — لاگ را ببین" : "بازسازی ناموفق — لاگ را ببین", "err");
      }
    }
  }
  taskTimers[name] = setInterval(tick, 1500);
  tick();
}

  let OBJ = r.parsed;
  let RAW = r.raw;

  const head = viewhead(path, fmtSize(r.size) + (isJson ? (r.parsed !== null ? " · JSON معتبر" : " · JSON خراب!") : ""));

    bkList.innerHTML = "";

      const rb = el("button", "btn warnb sm", "بازگردانی");

        if(!confirm("نسخهٔ «" + b.name + "» جایگزین فایل فعلی شود؟ (از فعلی هم پشتیبان گرفته می‌شود)")) return;
        const rr = await fetch("/admin/api/restore", {method:"PUT", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({path: path, name: b.name})}).then(x => x.json());
        if(rr.ok){ toast("بازگردانی شد ✓", "ok"); PEND = {}; route(); }
        else toast("خطا: " + rr.error, "err");
      };
      d.appendChild(rb);
      bkList.appendChild(d);

  head.append(bk);
  body.appendChild(head);

  const bar = el("div", "toolbar");

    const bf = el("button", "btn gray sm", "فرم");
    const br = el("button", "btn gray sm", "JSON خام");
    const fmt = el("button", "btn gray sm", "فرمت‌کردن");
    bf.onclick = () => { try{ OBJ = JSON.parse(ta.value); RAW = JSON.stringify(OBJ, null, 2); MODE = "form"; syncFormGlobals(); draw(); }catch(e){ toast("JSON نامعتبر: " + e.message, "err"); } };
    br.onclick = () => { try{ RAW = JSON.stringify(OBJ, null, 2); }catch(e){} MODE = "raw"; draw(); };
    fmt.onclick = () => {
      try{
        RAW = JSON.stringify(JSON.parse(ta.value), null, 2);
        touchRaw(path, RAW); updateDirty();
        MODE = "raw"; draw();
        toast("فرمت شد ✓", "ok");
      }catch(e){ toast("JSON نامعتبر: " + e.message, "err"); }
    };
    bar.append(bf, br, fmt);
    if(MODE === "form") bf.style.background = "var(--acc-soft)", bf.style.color = "var(--acc)";
    else br.style.background = "var(--acc-soft)", br.style.color = "var(--acc)";
  }
  body.appendChild(bar);
  const holder = el("div");
  body.appendChild(holder);
  let ta;
  function syncFormGlobals(){ CURRAWPATH = path; CURRAWOBJ = OBJ; RERENDER_FORM = () => { holder.innerHTML = ""; const f = el("div", "card"); renderValue(CURRAWOBJ, f, [], true); holder.appendChild(f); }; }
  function draw(){
    holder.innerHTML = "";
    if(MODE === "form"){
      syncFormGlobals();
      const f = el("div", "card");
      renderValue(OBJ, f, [], true);
      holder.appendChild(f);
    } else {
      ta = document.createElement("textarea");
      ta.className = "raw";
      ta.value = RAW;
      ta.oninput = () => { RAW = ta.value; touchRaw(path, RAW); updateDirty(); };
      holder.appendChild(ta);
    }
  }
  draw();
}
/* recursive form renderer (for small JSONs in raw view) */
let CURRAWPATH = "", CURRAWOBJ = null, RERENDER_FORM = null;
function renderValue(v, box, path, root){
  const t = typeof v;
  if(v === null || t === "string" || t === "number" || t === "boolean"){
    const w = el("div", "fld");
    w.appendChild(el("label", "ltr", esc(path.join("."))));
    if(t === "string" && v.length > 60){
      const ta = document.createElement("textarea");
      ta.value = v; ta.classList.add("ltr");
      ta.oninput = () => { setPath(path, ta.value); };
      w.appendChild(ta);
    } else {
      const i = document.createElement("input");
      i.type = t === "number" ? "number" : "text";
      i.value = v; i.classList.add("ltr");
      i.oninput = () => setPath(path, t === "number" ? (isNaN(+i.value) ? i.value : +i.value) : i.value);
      w.appendChild(i);
    }
    box.appendChild(w);
    return;
  }
  const fs = el("fieldset");
  fs.appendChild(el("legend", "ltr", esc(path.length ? path.join(".") : "ریشه")));
  if(Array.isArray(v)){
    v.forEach((item, i) => {
      const rw = el("div", "");
      const del = el("button", "del", "حذف");
      del.onclick = () => { v.splice(i, 1); touchRaw(CURRAWPATH, JSON.stringify(CURRAWOBJ)); updateDirty(); if(RERENDER_FORM) RERENDER_FORM(); };
      rw.appendChild(del);
      renderValue(item, rw, path.concat(i), false);
      fs.appendChild(rw);
    });
    const add = el("button", "add", "＋ افزودن مورد");
    add.onclick = () => {
      v.push(typeof v[0] === "object" && v[0] && !Array.isArray(v[0]) ? {} : (Array.isArray(v[0]) ? [] : ""));
      touchRaw(CURRAWPATH, JSON.stringify(CURRAWOBJ)); updateDirty();
      if(RERENDER_FORM) RERENDER_FORM();
    };
    fs.appendChild(add);
  } else {
    Object.keys(v).forEach(k => renderValue(v[k], fs, path.concat(k), false));
  }
  box.appendChild(fs);
}
function setPath(path, val){
  let o = CURRAWOBJ;
  for(let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = val;
  touchRaw(CURRAWPATH, JSON.stringify(CURRAWOBJ));
  updateDirty();
}

async function vSearch(q){
  q = q || "";

  body.appendChild(head);

  body.appendChild(list);
  async function run(){
    if(!qi.value.trim()){ list.innerHTML = ""; return; }
    list.innerHTML = "<div class='hint'>در حال جستجو…</div>";
    const r = await apiGet("search?q=" + enc(qi.value) + "&_t=" + Date.now());
    list.innerHTML = "";
    list.appendChild(el("div", "hint", r.results.length ? (r.results.length + " فایل یافت شد — برای ویرایش کلیک کن:") : "چیزی پیدا نشد."));
    r.results.forEach(res => {
      const d = el("div", "sres");
      d.innerHTML = '<div class="f">' + esc(res.file) + '</div>' + res.hits.map(hh => '<div class="h">' + esc(hh) + '</div>').join("");
      d.onclick = () => nav("raw/" + res.file);
      list.appendChild(d);
    });
  }
  qi.oninput = debounce(run, 400);
  if(q) { qi.value = q; run(); }
}
function debounce(fn, ms){
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
