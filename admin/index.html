<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت chinifa (چی‌نی‌فا)</title>
  <script>
    // انتقال فوری و هوشمند به پنل جامع مدیریت
    window.location.replace("../tools/admin/" + location.hash);
  </script>
  <style>
    body {
      background: #0b121a;
      color: #d9e4ef;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #131d29;
      border: 1px solid #22303f;
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 420px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(43,209,157,0.2);
      border-top-color: #2bd19d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      color: #2bd19d;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 10px; font-size: 18px; color: #fff;">پنل مدیریت جامع chinifa</h2>
    <p style="margin: 0 0 16px; font-size: 13.5px; color: #8ba0b5;">در حال بارگذاری و انتقال به داشبورد یکپارچه مدیریت...</p>
    <a href="../tools/admin/">ورود مستقیم به پنل مدیریت</a>
  </div>
</body>
</html>
